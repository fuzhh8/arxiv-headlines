  /* Date range */

  function offsetDate(ymd, dayOffset) {
    const dt = new Date(`${ymd}T00:00:00`);
    dt.setDate(dt.getDate() + dayOffset);
    return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
  }

  function setDateRange(range, save = true) {
    currentDateRange = range === 'custom' ? 'custom' : Number(range);

    document.querySelectorAll('.range-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.range === String(currentDateRange));
    });

    const customWrap = document.getElementById('customStartWrap');
    const startInput = document.getElementById('rangeStart');
    customWrap.hidden = currentDateRange !== 'custom';
    if (currentDateRange === 'custom' && !startInput.value) {
      startInput.value = offsetDate(document.getElementById('day').value || defaultArxivDate(), -6);
      customStartDate = startInput.value;
    }

    if (save) {
      saveSettings();
      loadPapers();
    }
  }

  function getDateList(endDate, range, startDate = '') {
    const dates = [];
    const dt = new Date(`${endDate}T00:00:00`);
    if (range === 'custom') {
      if (!/^\d{4}-\d{2}-\d{2}$/.test(startDate)) {
        throw new Error('Please select a custom start date.');
      }
      const start = new Date(`${startDate}T00:00:00`);
      if (start > dt) throw new Error('The custom start date must not be after the selected date.');
      for (let i = 0; i < 90; i++) {
        const date = offsetDate(endDate, -i);
        if (date < startDate) break;
        dates.push(date);
      }
      if (dates.at(-1) !== startDate) {
        throw new Error('A custom date range can include at most 90 days.');
      }
      return dates;
    }

    for (let i = 0; i < Number(range); i++) {
      dates.push(`${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`);
      dt.setDate(dt.getDate() - 1);
    }

    return dates;
  }

  function categoryToDataDir(code) {
    return code.replaceAll('.', '-');
  }

  function emptyStaticPayload(category, date) {
    return {
      schemaVersion: STATIC_DATA_SCHEMA,
      status: 'ok',
      source: 'weekend',
      category,
      date,
      counts: { new: 0, cross: 0, repl: 0 },
      papersBySection: { new: [], cross: [], repl: [] }
    };
  }

  function isValidStaticPayload(payload, category, date) {
    return payload?.schemaVersion === STATIC_DATA_SCHEMA &&
      payload?.status === 'ok' &&
      payload?.category === category &&
      payload?.date === date &&
      SECTIONS.every(sec => Array.isArray(payload?.papersBySection?.[sec]));
  }

  function revivePaper(paper, fallbackDate) {
    return {
      ...paper,
      published: paper?.published ? new Date(paper.published) : null,
      updated: paper?.updated ? new Date(paper.updated) : null,
      catchupDate: paper?.catchupDate || fallbackDate
    };
  }

  async function fetchApiCachedDay(category, date) {
    try {
      const resp = await fetch(
        apiUrl(`/api/cache?category=${encodeURIComponent(category)}&date=${encodeURIComponent(date)}`),
        { headers: { Accept: 'application/json' }, cache: 'no-store' }
      );
      if (!resp.ok) return null;
      const payload = await resp.json();
      return isValidStaticPayload(payload, category, date) ? payload : null;
    } catch (_) {
      return null;
    }
  }

  async function fetchStaticDay(category, date, options = {}) {
    // arXiv has no weekend announcement files, so weekends are known-empty and
    // should not force the browser onto the slow live-proxy path.
    if (isWeekend(date)) return emptyStaticPayload(category, date);

    if (options.preferApi) {
      const remote = await fetchApiCachedDay(category, date);
      if (remote) return remote;
    }

    const dir = categoryToDataDir(category);
    const url = `data/${encodeURIComponent(dir)}/${encodeURIComponent(date)}.json`;

    try {
      const resp = await fetch(url, {
        headers: { Accept: 'application/json' },
        cache: 'no-cache'
      });

      if (!resp.ok) return fetchApiCachedDay(category, date);

      const payload = await resp.json();
      if (isValidStaticPayload(payload, category, date)) return payload;
      return fetchApiCachedDay(category, date);
    } catch (e) {
      console.warn(`Static data unavailable for ${category}/${date}:`, e);
      return fetchApiCachedDay(category, date);
    }
  }

  async function requestOnDemandDay(category, date) {
    let resp;
    try {
      resp = await fetch(apiUrl('/api/fetch'), {
        method: 'POST',
        headers: {
          Accept: 'application/json',
          'Content-Type': 'application/json'
        },
        cache: 'no-store',
        body: JSON.stringify({ category, date })
      });
    } catch (error) {
      const unavailable = new Error('Local on-demand fetch service is unavailable');
      unavailable.serviceUnavailable = true;
      unavailable.cause = error;
      throw unavailable;
    }

    let result = null;
    try {
      result = await resp.json();
    } catch (_) {}

    if (!resp.ok || !result?.ok) {
      const error = new Error(result?.error || `On-demand fetch failed (HTTP ${resp.status})`);
      error.serviceUnavailable = [404, 405, 501].includes(resp.status);
      throw error;
    }

    return result;
  }

  const figureWatchers = new Map();

  function setBackgroundFigureStatus(message, state = 'working') {
    const content = document.getElementById('content');
    if (!content) return;
    let status = document.getElementById('backgroundFigureStatus');
    if (!status) {
      status = document.createElement('div');
      status.id = 'backgroundFigureStatus';
      status.className = 'info';
      content.prepend(status);
    }
    status.dataset.state = state;
    status.textContent = message;
  }

  async function refreshFiguresFromCache(category, date, generation) {
    const payload = await fetchStaticDay(category, date, { preferApi: true });
    if (!payload || generation !== loadGeneration || selectedCategory !== category) return 0;

    const enrichedById = new Map();
    for (const section of SECTIONS) {
      for (const paper of payload.papersBySection[section]) {
        if (paper?.absId) enrichedById.set(paper.absId, paper);
      }
    }

    const meta = window.__LAST_RENDER_META__;
    if (!meta) return 0;
    let updatedVisibleCards = 0;
    for (const section of SECTIONS) {
      for (const paper of meta.papersBySection[section]) {
        const enriched = enrichedById.get(paper.absId);
        if (!enriched) continue;
        const previousFigureCount = paperFigures(paper).length;
        paper.figures = enriched.figures || [];
        paper.thumbnailUrl = enriched.thumbnailUrl || '';
        paper.thumbnailAlt = enriched.thumbnailAlt || '';
        const card = document.querySelector(`.paper-card[data-absid="${CSS.escape(paper.absId)}"]`);
        if (card && paperFigures(paper).length > previousFigureCount) {
          const visual = card.querySelector('.paper-visual');
          if (visual) {
            visual.outerHTML = renderPaperVisual(paper);
            updatedVisibleCards++;
          }
        }
      }
    }
    return updatedVisibleCards;
  }

  async function prioritizeCurrentPageFigures(category, date) {
    const ids = [...document.querySelectorAll('.paper-card[data-absid]')]
      .map(card => card.getAttribute('data-absid'))
      .filter(id => {
        const paper = window.__PAPER_BY_ID__?.get(id);
        return paper && (paper.catchupDate || paper.published?.toISOString?.().slice(0, 10)) === date;
      });
    if (!ids.length) return '';

    const signature = ids.join(',');
    try {
      await fetch(apiUrl('/api/fetch/prioritize'), {
        method: 'POST',
        headers: { Accept: 'application/json', 'Content-Type': 'application/json' },
        cache: 'no-store',
        body: JSON.stringify({ category, date, ids })
      });
    } catch (_) {}
    return signature;
  }

  async function watchFigureEnrichment(category, date, generation) {
    const key = `${category}/${date}`;
    if (figureWatchers.has(key)) return figureWatchers.get(key);

    const task = (async () => {
      let lastPrioritySignature = '';
      let lastRefreshedAt = 0;
      while (generation === loadGeneration && selectedCategory === category) {
        const visibleIds = [...document.querySelectorAll('.paper-card[data-absid]')]
          .map(card => card.getAttribute('data-absid'))
          .filter(id => {
            const paper = window.__PAPER_BY_ID__?.get(id);
            return paper && (paper.catchupDate || paper.published?.toISOString?.().slice(0, 10)) === date;
          })
          .join(',');
        if (visibleIds && visibleIds !== lastPrioritySignature) {
          lastPrioritySignature = await prioritizeCurrentPageFigures(category, date) || visibleIds;
        }

        let response;
        try {
          response = await fetch(
            apiUrl(`/api/fetch/status?category=${encodeURIComponent(category)}&date=${encodeURIComponent(date)}`),
            { headers: { Accept: 'application/json' }, cache: 'no-store' }
          );
        } catch (_) {
          return;
        }
        if (!response.ok) return;

        const result = await response.json();
        const figures = result?.figures;
        if (!figures) return;

        if (figures.phase === 'queued') {
          setBackgroundFigureStatus(`🛰 Paper list ready. Figures for ${date} are queued…`);
        } else if (figures.phase === 'figures') {
          const pct = figures.total ? Math.round((figures.processed / figures.total) * 100) : 100;
          if (figures.processed - lastRefreshedAt >= 2) {
            await refreshFiguresFromCache(category, date, generation);
            lastRefreshedAt = figures.processed;
          }
          setBackgroundFigureStatus(
            `🛰 Paper list ready · figures ${figures.processed}/${figures.total} (${pct}%) · found ${figures.found}`
          );
        } else if (figures.phase === 'complete') {
          await refreshFiguresFromCache(category, date, generation);
          setBackgroundFigureStatus(`✅ Figures ready for ${date}: ${figures.found}/${figures.total}`, 'complete');
          setTimeout(() => document.getElementById('backgroundFigureStatus')?.remove(), 5000);
          return;
        } else if (figures.phase === 'failed') {
          setBackgroundFigureStatus(`⚠ Figure extraction failed for ${date}: ${figures.error || 'unknown error'}`, 'failed');
          return;
        } else {
          return;
        }

        await delay(1500);
      }
    })().finally(() => figureWatchers.delete(key));

    figureWatchers.set(key, task);
    return task;
  }

  async function fetchLatestStatic(category) {
    if (!category || SAVED_TAB_CODES.has(category)) return null;
    const dir = categoryToDataDir(category);
    try {
      const resp = await fetch(`data/${encodeURIComponent(dir)}/latest.json`, {
        headers: { Accept: 'application/json' },
        cache: 'no-cache'
      });
      if (!resp.ok) return null;
      const payload = await resp.json();
      return /^\d{4}-\d{2}-\d{2}$/.test(payload?.date || '') &&
        isValidStaticPayload(payload, category, payload.date) ? payload : null;
    } catch (_) {
      return null;
    }
  }

  function mergeStaticPayloads(payloads, category, selectedDate, dateList, options = {}) {
    const papersBySection = Object.fromEntries(SECTIONS.map(sec => [sec, []]));
    const seen = Object.fromEntries(SECTIONS.map(sec => [sec, new Set()]));

    for (const payload of payloads) {
      for (const sec of SECTIONS) {
        for (const rawPaper of payload.papersBySection[sec]) {
          const paper = revivePaper(rawPaper, payload.date);
          if (!paper.absId || seen[sec].has(paper.absId)) continue;
          seen[sec].add(paper.absId);
          papersBySection[sec].push(paper);
        }
      }
    }

    const counts = Object.fromEntries(SECTIONS.map(sec => [sec, papersBySection[sec].length]));

    return {
      category,
      date: selectedDate,
      dateRange: dateList,
      enabled: { new: true, cross: true, repl: true },
      counts,
      shownCounts: { ...counts },
      papersBySection,
      fallbackUsed: Boolean(options.fallbackUsed),
      cacheMissDates: options.cacheMissDates || [],
      dataSource: options.dataSource || 'static'
    };
  }

  function indexPapers(papersBySection) {
    window.__PAPER_BY_ID__ = new Map();

    for (const sec of SECTIONS) {
      for (const paper of papersBySection[sec]) {
        if (paper?.absId) window.__PAPER_BY_ID__.set(paper.absId, paper);
      }
    }
  }

  function isWeekend(ymd) {
    const dow = new Date(`${ymd}T00:00:00`).getDay();
    return dow === 0 || dow === 6;
  }

  function prevFriday(ymd) {
    const dt = new Date(`${ymd}T00:00:00`);
    const dow = dt.getDay();

    if (dow === 0) dt.setDate(dt.getDate() - 2);
    else if (dow === 6) dt.setDate(dt.getDate() - 1);

    return `${dt.getFullYear()}-${pad2(dt.getMonth() + 1)}-${pad2(dt.getDate())}`;
  }

  function defaultArxivDate() {
    const d = new Date();

    let ymd = `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;

    if (isWeekend(ymd)) {
      ymd = prevFriday(ymd);
    }

    return ymd;
  }

  /* Proxy fetch */

  async function fetchWithProxy(url, accept) {
    if (fetchCache.has(url)) return fetchCache.get(url);

    const total = PROXY_SERVICES.length;
    const errors = [];

    for (let attempt = 0; attempt < total; attempt++) {
      const idx = (lastGoodProxyIdx + attempt) % total;
      const proxy = PROXY_SERVICES[idx];
      const proxyUrl = proxy.build(url);

      try {
        const ctrl = new AbortController();
        const tid = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);

        const resp = await fetch(proxyUrl, {
          signal: ctrl.signal,
          headers: {
            Accept: accept || '*/*'
          },
          cache: 'no-store'
        });

        clearTimeout(tid);

        if (!resp.ok) {
          throw new Error(`${proxy.name}: HTTP ${resp.status}`);
        }

        const text = await resp.text();

        if (!text || text.length < 80) {
          throw new Error(`${proxy.name}: Empty or too short response`);
        }

        validateProxyText(text, accept, proxy.name);

        lastGoodProxyIdx = idx;
        fetchCache.set(url, text);

        console.log(`Proxy OK: ${proxy.name}`, url);
        return text;

      } catch (e) {
        console.warn(`Proxy failed: ${proxy.name}`, e);
        errors.push(e.message || String(e));
      }
    }

    throw new Error(`All proxy services failed:\n${errors.join('\n')}`);
  }

  function validateProxyText(text, accept, proxyName) {
    const lower = text.toLowerCase();

    const badMarkers = [
      'too many requests',
      'access denied',
      'captcha',
      'blocked',
      'rate limit',
      'forbidden',
      'service unavailable',
      'cloudflare attention required',
      'error occurred while trying to proxy'
    ];

    for (const marker of badMarkers) {
      if (lower.includes(marker)) {
        throw new Error(`${proxyName}: Proxy returned blocked/error page: ${marker}`);
      }
    }

    if (accept?.includes('xml')) {
      if (!lower.includes('<feed') && !lower.includes('<?xml')) {
        throw new Error(`${proxyName}: Expected XML but got non-XML response`);
      }
    }

    if (accept?.includes('html')) {
      if (!lower.includes('<html') && !lower.includes('/abs/')) {
        throw new Error(`${proxyName}: Expected arXiv HTML but got invalid response`);
      }
    }
  }

  /* Parse catchup page */

  function parseCatchupByHeadings(htmlText) {
    const doc = new DOMParser().parseFromString(htmlText, 'text/html');
    const root = doc.querySelector('#content') || doc;
    const out = { new: [], cross: [], repl: [] };

    const keyFor = t => {
      const s = cleanText(t).toLowerCase();

      if (s.startsWith('new submissions')) return 'new';
      if (s.startsWith('cross submissions') || s.startsWith('cross-lists') || s.startsWith('cross lists')) return 'cross';
      if (s.startsWith('replacement submissions') || s.startsWith('replacements')) return 'repl';

      return null;
    };

    for (const h3 of root.querySelectorAll('h3')) {
      const key = keyFor(h3.textContent || '');
      if (!key) continue;

      let node = h3.nextElementSibling;

      while (node && node.tagName?.toLowerCase() !== 'h3') {
        for (const a of node.querySelectorAll('a[href*="/abs/"]')) {
          const id = extractIdFromAbsUrl(a.getAttribute('href') || '');
          if (id) out[key].push(id);
        }

        node = node.nextElementSibling;
      }
    }

    return out;
  }

  /* Parse arXiv API XML */

  function parseArxivApi(xmlText) {
    const xml = new DOMParser().parseFromString(xmlText, 'text/xml');

    if (xml.querySelector('parsererror')) {
      throw new Error('API XML parse error');
    }

    return Array.from(xml.getElementsByTagName('entry')).reduce((acc, e) => {
      const title = cleanText(e.getElementsByTagName('title')[0]?.textContent);
      const summary = cleanText(e.getElementsByTagName('summary')[0]?.textContent);
      const idUrl = e.getElementsByTagName('id')[0]?.textContent;

      if (!title || !summary || !idUrl) return acc;

      const absId = extractIdFromAbsUrl(idUrl);

      acc.push({
        absId,
        title,
        summary,
        published: e.getElementsByTagName('published')[0]?.textContent
          ? new Date(e.getElementsByTagName('published')[0].textContent)
          : null,
        updated: e.getElementsByTagName('updated')[0]?.textContent
          ? new Date(e.getElementsByTagName('updated')[0].textContent)
          : null,
        link: idUrl,
        authors: Array.from(e.getElementsByTagName('author'))
          .map(a => a.getElementsByTagName('name')[0]?.textContent?.trim())
          .filter(Boolean),
        categories: Array.from(e.getElementsByTagName('category'))
          .map(c => c.getAttribute('term'))
          .filter(Boolean)
      });

      return acc;
    }, []);
  }

  /* API fallback */

  function arxivDateCompact(ymd) {
    return ymd.replaceAll('-', '');
  }

  function buildCategoryQuery(category) {
    if (category === 'astro-ph') {
      return [
        'cat:astro-ph.CO',
        'cat:astro-ph.EP',
        'cat:astro-ph.GA',
        'cat:astro-ph.HE',
        'cat:astro-ph.IM',
        'cat:astro-ph.SR'
      ].join(' OR ');
    }

    return `cat:${category}`;
  }

  async function fetchPapersByApiFallback(category, dateList) {
    const papers = [];
    const seen = new Set();

    for (const ymd of dateList) {
      const d = arxivDateCompact(ymd);
      const query = `(${buildCategoryQuery(category)}) AND submittedDate:[${d}0000 TO ${d}2359]`;

      const url =
        `https://export.arxiv.org/api/query?search_query=${encodeURIComponent(query)}` +
        `&start=0&max_results=200&sortBy=submittedDate&sortOrder=descending`;

      try {
        const xml = await fetchWithProxy(url, 'application/atom+xml, application/xml, text/xml');
        const items = parseArxivApi(xml);

        for (const p of items) {
          if (!p.absId || seen.has(p.absId)) continue;

          seen.add(p.absId);
          p.catchupDate = ymd;
          papers.push(p);
        }

        // Be gentle with public proxies and arXiv API.
        await delay(500);

      } catch (e) {
        console.warn(`API fallback failed for ${ymd}`, e);
      }
    }

    return papers;
  }

  /* Fetch metadata for IDs */

  async function fetchPapersForIds(ids) {
    const chunks = chunkArray(ids, MAX_CHUNK);
    const results = [];

    for (const chunk of chunks) {
      const url = `https://export.arxiv.org/api/query?id_list=${encodeURIComponent(chunk.join(','))}&start=0&max_results=${chunk.length}`;
      const xml = await fetchWithProxy(url, 'application/atom+xml, application/xml, text/xml');
      results.push(xml);

      // Be gentle with public proxies and arXiv API.
      await delay(400);
    }

    const map = new Map();

    for (const xml of results) {
      for (const p of parseArxivApi(xml)) {
        if (p.absId) map.set(p.absId, p);
      }
    }

    return map;
  }

  /* Skeleton */

  function renderSkeletons(count = 4) {
    return Array.from({ length: count }, () => `
      <div class="skeleton-card">
        <div class="skeleton sk-title"></div>
        <div class="skeleton sk-author"></div>
        <div class="skeleton sk-date"></div>
        <div class="skeleton sk-link"></div>
      </div>`).join('');
  }

  function setProgress(pct) {
    const bar = document.getElementById('progressBar');
    if (bar) bar.style.width = `${pct}%`;
  }

  /* Filter */

  function filterPapers(papers) {
    const semanticIds = window.__semanticResults__ ? new Set(window.__semanticResults__) : null;

    const filtered = papers.filter(p => {
      const state = readingStates.get(p.absId) || 'unread';
      const matchesSearch = !searchQuery || (semanticIds
        ? semanticIds.has(p.absId)
        : paperMatchesSearch(p, searchQuery));
      const matchesCategory = categoryFilter === 'all' || p.categories?.includes(categoryFilter);
      const matchesReading = readingFilter === 'all' ||
        (readingFilter === 'favorite' ? favorites.has(p.absId) : state === readingFilter);
      const hasFigure = paperFigures(p).length > 0;
      const matchesImage = imageFilter === 'all' ||
        (imageFilter === 'with' ? hasFigure : !hasFigure);
      return matchesSearch && matchesCategory && matchesReading && matchesImage;
    });

    return filtered.sort((a, b) => {
      if (sortMode === 'title') return (a.title || '').localeCompare(b.title || '');
      const aDate = a.catchupDate || a.published?.toISOString?.() || '';
      const bDate = b.catchupDate || b.published?.toISOString?.() || '';
      return sortMode === 'date-asc' ? aDate.localeCompare(bDate) : bDate.localeCompare(aDate);
    });
  }

  function rerenderCurrentView(preferredAbsId = '') {
    if (SAVED_TAB_CODES.has(selectedCategory)) renderSavedView(selectedCategory);
    else if (window.__LAST_RENDER_META__) renderSections(window.__LAST_RENDER_META__);
    if (preferredAbsId) {
      const paper = window.__PAPER_BY_ID__?.get(preferredAbsId);
      if (paper && document.querySelector(`.paper-card[data-absid="${CSS.escape(preferredAbsId)}"]`)) setPreviewPaper(paper);
    }
  }

  function openFigureGallery(absId, index = 0) {
    const paper = window.__PAPER_BY_ID__?.get(absId);
    const figures = paperFigures(paper);
    if (!paper || !figures.length) return;
    closePaperQuickView(false);
    galleryPaper = paper;
    galleryIndex = Math.max(0, Math.min(index, figures.length - 1));
    updateFigureGallery();
    document.getElementById('figureModal').hidden = false;
    document.body.style.overflow = 'hidden';
    const closeButton = window.matchMedia('(max-width: 650px)').matches
      ? document.getElementById('figureCloseBottom')
      : document.getElementById('figureClose');
    closeButton.focus({ preventScroll: true });
  }

  function updateFigureGallery() {
    const figures = paperFigures(galleryPaper);
    if (!figures.length) return;
    const figure = figures[galleryIndex];
    document.getElementById('figureModalTitle').textContent = galleryPaper.title || 'Paper figures';
    document.getElementById('figurePosition').textContent = `${galleryIndex + 1} / ${figures.length}`;
    document.getElementById('figureImage').src = figure.url;
    document.getElementById('figureImage').alt = figure.caption || `Figure ${galleryIndex + 1}`;
    setFigureZoomMode('fit');
    const caption = document.getElementById('figureCaption');
    window.MathJax?.typesetClear?.([caption]);
    caption.innerHTML = captionWithLatex(figure.caption);
    window.MathJax?.typesetPromise?.([caption]).catch(() => {});
    document.getElementById('figurePrev').disabled = galleryIndex === 0;
    document.getElementById('figureNext').disabled = galleryIndex === figures.length - 1;
  }

  function setFigureZoomMode(mode) {
    galleryZoomMode = mode === 'actual' ? 'actual' : 'fit';
    const figureStage = document.getElementById('figureStage');
    const toggle = document.getElementById('figureZoomToggle');
    figureStage.classList.toggle('is-fit', galleryZoomMode === 'fit');
    figureStage.classList.toggle('is-actual', galleryZoomMode === 'actual');
    figureStage.scrollLeft = 0;
    figureStage.scrollTop = 0;
    toggle.textContent = galleryZoomMode === 'fit' ? '1:1' : 'Fit';
    toggle.setAttribute('aria-label', galleryZoomMode === 'fit'
      ? 'Show figure at original size'
      : 'Fit entire figure to screen');
  }

  function closeFigureGallery() {
    document.getElementById('figureModal').hidden = true;
    document.getElementById('figureImage').removeAttribute('src');
    document.body.style.overflow = '';
    galleryPaper = null;
  }

  function openPaperQuickView(paper, trigger = document.activeElement) {
    if (!paper) return;
    setPreviewPaper(paper);
    const modal = document.getElementById('paperQuickView');
    const body = document.getElementById('paperQuickViewBody');
    const authors = (paper.authors || []).filter(Boolean).join(', ') || 'Unknown authors';
    const figures = paperFigures(paper);
    const date = paper.published
      ? paper.published.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })
      : '';
    const adsUrl = `https://ui.adsabs.harvard.edu/abs/${encodeURIComponent(`arXiv:${paper.absId}`)}/abstract`;
    quickViewReturnFocus = trigger?.closest?.('.paper-card') || null;
    window.MathJax?.typesetClear?.([body]);
    body.innerHTML = `
      <div class="preview-title" id="paperQuickViewTitle">${highlightText(paper.title || '', searchQuery)}</div>
      <div class="preview-meta">${escapeHtml(authors)}${date ? ` · ${escapeHtml(date)}` : ''}${paper.categories?.length ? ` · ${escapeHtml(paper.categories.join(', '))}` : ''}</div>
      <div class="preview-abstract">${highlightText(paper.summary || 'No abstract available.', searchQuery)}</div>
      <div class="paper-quickview-links">
        ${figures.length ? `<button class="preview-action" type="button" onclick="openFigureGallery('${escapeHtml(paper.absId)}')">▧ Figures (${figures.length})</button>` : ''}
        <a class="preview-action" href="${escapeHtml(paper.link)}" target="_blank" rel="noopener">arXiv</a>
        <a class="preview-action" href="https://arxiv.org/pdf/${escapeHtml(paper.absId)}.pdf" target="_blank" rel="noopener">PDF</a>
        <a class="preview-action" href="${escapeHtml(adsUrl)}" target="_blank" rel="noopener">NASA ADS</a>
      </div>`;
    body.scrollTop = 0;
    modal.hidden = false;
    document.body.style.overflow = 'hidden';
    window.MathJax?.typesetPromise?.([body]).catch(() => {});
    document.getElementById('paperQuickViewClose').focus({ preventScroll: true });
  }

  function closePaperQuickView(restoreFocus = true) {
    const modal = document.getElementById('paperQuickView');
    if (!modal || modal.hidden) return;
    modal.hidden = true;
    document.body.style.overflow = '';
    if (restoreFocus) quickViewReturnFocus?.focus?.({ preventScroll: true });
    quickViewReturnFocus = null;
  }

  /* Render card */

  function renderPaperVisual(p) {
    const figures = paperFigures(p);
    const thumbnailUrl = figures[0]?.url || '';
    const thumbnailAlt = p.thumbnailAlt || `First figure from ${p.title}`;
    const categoryLabel = p.categories?.[0] || 'arXiv';

    return `
      <div class="paper-visual${thumbnailUrl ? ' has-image' : ''}"
           ${thumbnailUrl ? `onclick="event.stopPropagation();openFigureGallery('${escapeHtml(p.absId)}')" title="Open figure gallery"` : ''}>
        ${thumbnailUrl ? `<img src="${escapeHtml(thumbnailUrl)}"
          alt="${escapeHtml(thumbnailAlt)}"
          loading="lazy" decoding="async" referrerpolicy="no-referrer"
          onerror="this.parentElement.classList.add('image-error');this.remove()" />` : ''}
        <span class="paper-visual-placeholder">${escapeHtml(categoryLabel)}</span>
        ${figures.length ? `<span class="figure-count">▧ ${figures.length}</span>` : ''}
      </div>`;
  }

  function renderPaperCard(p, sec) {
    const isFav = favorites.has(p.absId);
    const readingState = readingStates.get(p.absId) || 'unread';

    const authors = p.authors?.length
      ? `${p.authors.slice(0, 3).join(', ')}${p.authors.length > 3 ? ' et al.' : ''}`
      : 'Unknown authors';

    const dateStr = p.published
      ? p.published.toLocaleDateString('en-US', { year: 'numeric', month: 'short', day: 'numeric' })
      : '';

    const adsUrl = `https://ui.adsabs.harvard.edu/abs/${encodeURIComponent(`arXiv:${p.absId}`)}/abstract`;
    const visual = renderPaperVisual(p);

    return `
      <div class="paper-card${isFav ? ' favorited' : ''}${searchQuery ? ' search-match' : ''}"
           tabindex="0" data-absid="${escapeHtml(p.absId)}"
           data-sec="${escapeHtml(sec)}" role="article"
           aria-label="${escapeHtml(p.title)}">
        ${visual}
        <div class="paper-title">${highlightText(p.title, searchQuery)}</div>
        <div class="paper-authors">${highlightText(authors, searchQuery)}</div>
        ${dateStr ? `<div class="paper-date">📅 ${escapeHtml(dateStr)}</div>` : ''}
        <div class="paper-footer">
          <a class="paper-link" href="${escapeHtml(p.link)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open arXiv</a>
          <a class="paper-link" href="https://arxiv.org/pdf/${escapeHtml(p.absId)}.pdf" target="_blank" rel="noopener" onclick="event.stopPropagation()">Open PDF</a>
          <a class="paper-link" href="${escapeHtml(adsUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">NASA ADS</a>
          <div class="card-actions">
          <button class="icon-btn state-btn${readingState === 'queue' ? ' active' : ''}"
                  title="${readingState === 'queue' ? 'Remove from to-read' : 'Add to to-read'}"
                  aria-label="Toggle to-read"
                  onclick="event.stopPropagation();setReadingState('${escapeHtml(p.absId)}','queue')">⌛ To read</button>
          <button class="icon-btn state-btn${readingState === 'read' ? ' active' : ''}"
                  title="${readingState === 'read' ? 'Mark unread' : 'Mark read'}"
                  aria-label="Toggle read"
                  onclick="event.stopPropagation();setReadingState('${escapeHtml(p.absId)}','read')">✓ Read</button>
          <button class="fav-btn icon-btn${isFav ? ' active' : ''}"
                  title="${isFav ? 'Remove from favorites' : 'Add to favorites'}"
                  aria-label="${isFav ? 'Remove from favorites' : 'Add to favorites'}"
                  onclick="event.stopPropagation();toggleFavorite('${escapeHtml(p.absId)}')">⭐</button>
          </div>
        </div>
      </div>`;
  }

  function renderPapersGrid(papers, sec, alreadyFiltered = false) {
    const filtered = alreadyFiltered ? papers : filterPapers(papers);

    if (!filtered.length) {
      if (searchQuery) {
        return `<div class="search-no-results">🔍 No papers match "<strong>${escapeHtml(searchQuery)}</strong>"</div>`;
      }

      return '<div class="info">No papers available</div>';
    }

    const cols = sectionColumns[sec] || 2;

    return `<div class="papers-grid cols-${cols}">${filtered.map(p => renderPaperCard(p, sec)).join('')}</div>`;
  }

  function paginationItems(page, totalPages) {
    const visible = new Set([1, totalPages]);
    for (let n = page - 2; n <= page + 2; n++) {
      if (n >= 1 && n <= totalPages) visible.add(n);
    }

    const items = [];
    let previous = 0;
    for (const value of [...visible].sort((a, b) => a - b)) {
      if (previous && value - previous > 1) items.push('ellipsis');
      items.push(value);
      previous = value;
    }
    return items;
  }

  function renderPagination(totalItems) {
    const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);
    if (totalItems <= pageSize) return '';

    const first = (currentPage - 1) * pageSize + 1;
    const last = Math.min(totalItems, currentPage * pageSize);
    const pageButtons = paginationItems(currentPage, totalPages).map(item => {
      if (item === 'ellipsis') return '<span class="page-ellipsis" aria-hidden="true">…</span>';
      const active = item === currentPage;
      return `<button class="page-button${active ? ' active' : ''}" type="button"
        ${active ? 'aria-current="page"' : ''} aria-label="Go to page ${item}"
        onclick="setPage(${item})">${item}</button>`;
    }).join('');

    return `
      <nav class="pagination" aria-label="Paper pages">
        <span class="pagination-summary">${first}–${last} of ${totalItems}</span>
        <button class="page-button" type="button" aria-label="Previous page"
          onclick="setPage(${currentPage - 1})" ${currentPage === 1 ? 'disabled' : ''}>←</button>
        ${pageButtons}
        <button class="page-button" type="button" aria-label="Next page"
          onclick="setPage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled' : ''}>→</button>
      </nav>`;
  }

  function sliceSectionGroups(groups) {
    const totalItems = groups.reduce((sum, group) => sum + group.papers.length, 0);
    const totalPages = Math.max(1, Math.ceil(totalItems / pageSize));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);

    const start = (currentPage - 1) * pageSize;
    const end = Math.min(totalItems, start + pageSize);
    let offset = 0;

    const visibleGroups = groups.map(group => {
      const localStart = Math.max(0, start - offset);
      const localEnd = Math.min(group.papers.length, end - offset);
      const papers = localStart < localEnd ? group.papers.slice(localStart, localEnd) : [];
      offset += group.papers.length;
      return { ...group, visiblePapers: papers };
    }).filter(group => group.visiblePapers.length > 0);

    return { totalItems, visibleGroups };
  }

  function setPage(page) {
    currentPage = Math.max(1, Number(page) || 1);
    rerenderCurrentView();
    requestAnimationFrame(() => {
      document.getElementById('listPane')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  }

  /* Saved-paper views */

  function savedViewConfig(code) {
    if (code === TO_READ_TAB_CODE) {
      return { icon: '⌛', label: 'To read', empty: 'No papers in your reading queue yet.', ids: [...readingStates].filter(([, state]) => state === 'queue').map(([id]) => id) };
    }
    if (code === READ_TAB_CODE) {
      return { icon: '✓', label: 'Read', empty: 'No papers marked as read yet.', ids: [...readingStates].filter(([, state]) => state === 'read').map(([id]) => id) };
    }
    return { icon: '⭐', label: 'Favorites', empty: 'No favorites yet.', ids: [...favorites] };
  }

  async function renderSavedView(code) {
    const content = document.getElementById('content');
    const view = savedViewConfig(code);
    window.MathJax?.typesetClear?.([content]);

    if (view.ids.length === 0) {
      content.innerHTML = `<div class="fav-empty"><div class="fav-empty-icon">${view.icon}</div><p>${escapeHtml(view.empty)}<br/>Use the matching button on any paper card to add one.</p></div>`;
      return;
    }

    const missingIds = view.ids.filter(id => !window.__PAPER_BY_ID__?.has(id));

    if (missingIds.length > 0) {
      content.innerHTML = `<div class="status">⏳ Loading ${missingIds.length} saved paper(s)…</div>`;

      try {
        if (!window.__PAPER_BY_ID__) window.__PAPER_BY_ID__ = new Map();

        const byId = await fetchPapersForIds(missingIds);

        for (const [k, v] of byId) {
          window.__PAPER_BY_ID__.set(k, v);
        }

      } catch (e) {
        content.innerHTML = `<div class="error">❌ Failed to load saved papers: ${escapeHtml(e.message)}</div>`;
        return;
      }
    }

    const allSavedPapers = view.ids.map(id => window.__PAPER_BY_ID__?.get(id)).filter(Boolean);
    const savedPapers = filterPapers(allSavedPapers);
    const totalPages = Math.max(1, Math.ceil(savedPapers.length / pageSize));
    currentPage = Math.min(Math.max(1, currentPage), totalPages);
    const pageStart = (currentPage - 1) * pageSize;
    const visiblePapers = savedPapers.slice(pageStart, pageStart + pageSize);
    const cols = sectionColumns.new || 2;

    content.innerHTML = `
      <div class="content-split">
        <div id="listPane">
          <div class="section">
            <div class="section-title">
              <div class="left">${view.icon} ${escapeHtml(view.label)} <span class="pill">matched ${savedPapers.length} / ${allSavedPapers.length}</span></div>
            </div>
            ${savedPapers.length === 0
              ? '<div class="info">No saved papers match the current filters.</div>'
              : `<div class="papers-grid cols-${cols}">${visiblePapers.map(p => renderPaperCard(p, 'saved')).join('')}</div>`}
            ${renderPagination(savedPapers.length)}
          </div>
        </div>
        <div class="preview-panels">
          <div class="abstract-card" id="abstractPane"><div class="preview-muted">Click a card to see the abstract.</div></div>
          <div class="pdf-card" id="pdfPane"><div class="preview-muted">PDF preview will appear here.</div></div>
        </div>
      </div>`;

    syncPreviewPanelVisibility();

    if (visiblePapers.length > 0) {
      setPreviewPaper(visiblePapers[0]);
    }

    window.MathJax?.typesetPromise?.([document.getElementById('listPane')]).catch(() => {});
  }

  /* Preview */

  function setPreviewPaper(paper) {
    const abstractPane = document.getElementById('abstractPane');
    const pdfPane = document.getElementById('pdfPane');

    if (!abstractPane || !pdfPane) return;

    currentSelectedCard?.classList.remove('selected');
    currentSelectedCard = document.querySelector(`.paper-card[data-absid="${CSS.escape(paper.absId)}"]`);
    currentSelectedCard?.classList.add('selected');

    const authors = (paper.authors || []).filter(Boolean);
    const authorsFull = authors.length <= 6 ? authors.join(', ') : `${authors.slice(0, 6).join(', ')}, et al.`;
    const figures = paperFigures(paper);
    const readingState = readingStates.get(paper.absId) || 'unread';

    abstractPane.innerHTML = `
      <div class="preview-title">${highlightText(paper.title || '', searchQuery)}</div>
      <div class="preview-meta">${escapeHtml(authorsFull || 'Unknown')}</div>
      <div class="preview-actions">
        ${figures.length ? `<button class="preview-action" type="button" onclick="openFigureGallery('${escapeHtml(paper.absId)}')">▧ Figures (${figures.length})</button>` : ''}
        <button class="preview-action${readingState === 'queue' ? ' active' : ''}" type="button" onclick="setReadingState('${escapeHtml(paper.absId)}','queue')">⌛ To read</button>
        <button class="preview-action${readingState === 'read' ? ' active' : ''}" type="button" onclick="setReadingState('${escapeHtml(paper.absId)}','read')">✓ Read</button>
      </div>
      <div class="preview-abstract">${highlightText(paper.summary || '', searchQuery)}</div>`;

    const showPdf = document.getElementById('pdfPreviewToggle').checked;
    const pdfCard = pdfPane.closest?.('.pdf-card');

    if (pdfCard) {
      pdfCard.style.display = showPdf ? 'flex' : 'none';
    }

    if (showPdf) {
      const pdfUrl = `https://arxiv.org/pdf/${paper.absId}.pdf`;

      pdfPane.innerHTML = `
        <div class="pdf-section-title">
          <span>📄 PDF Preview</span>
          <div class="pdf-actions">
            <a class="pdf-btn secondary" href="${escapeHtml(pdfUrl)}" target="_blank" rel="noopener">Open in New Tab</a>
          </div>
        </div>
        <div class="pdf-load-state">
          <div>
            <p>PDF is paused to keep browsing fast.<br/>Load it only when you want to review this paper.</p>
            <button class="pdf-btn" type="button" onclick="loadPdfPreview('${escapeHtml(paper.absId)}')">Load PDF Preview</button>
          </div>
        </div>`;
    } else {
      pdfPane.innerHTML = '<div class="preview-muted">PDF preview is disabled in Settings.</div>';
    }

    window.MathJax?.typesetPromise?.([abstractPane]).catch(() => {});
  }

  /* Render sections */

  function renderSections(meta) {
    if (SAVED_TAB_CODES.has(selectedCategory)) {
      renderSavedView(selectedCategory);
      return;
    }

    const content = document.getElementById('content');
    window.MathJax?.typesetClear?.([content]);
    let html = '';

    if (meta.fallbackUsed) {
      html += `<div class="info">⚠️ Some uncached dates used the arXiv API fallback. Section labels for those results may not match arXiv's New/Cross/Replacement lists.</div>`;
    } else if (meta.cacheMissDates?.length) {
      html += `<div class="info">📡 Cache kept ${meta.dateRange.length - meta.cacheMissDates.length} day(s); only ${meta.cacheMissDates.length} missing day(s) were fetched live.</div>`;
    }

    if (meta.dateRange?.length > 1) {
      html += `<div class="info">📅 Showing papers from ${escapeHtml(meta.dateRange.at(-1))} to ${escapeHtml(meta.dateRange[0])} (${meta.dateRange.length} days)</div>`;
    }

    html += `
      <div class="content-split">
        <div id="listPane"></div>
        <div class="preview-panels">
          <div class="abstract-card" id="abstractPane"><div class="preview-muted">Click on a paper card to see the abstract here.</div></div>
          <div class="pdf-card" id="pdfPane"><div class="preview-muted">Select a paper, then choose Load PDF Preview.</div></div>
        </div>
      </div>`;

    content.innerHTML = html;
    syncPreviewPanelVisibility();

    const listPane = document.getElementById('listPane');
    const groups = SECTIONS.filter(sec => meta.enabled[sec]).map(sec => ({
      sec,
      title: meta.fallbackUsed && sec === 'new' ? 'Submissions' : SECTION_LABELS[sec],
      papers: filterPapers(meta.papersBySection[sec]),
      unfilteredCount: meta.counts[sec]
    }));
    const { totalItems, visibleGroups } = sliceSectionGroups(groups);

    listPane.innerHTML = totalItems === 0
      ? '<div class="info">No papers match the current search and filters.</div>'
      : visibleGroups.map(group => `
          <div class="section">
            <div class="section-title">
              <div class="left">${escapeHtml(group.title)}
                <span class="pill">page ${group.visiblePapers.length} · matched ${group.papers.length} / ${escapeHtml(String(group.unfilteredCount))}</span>
              </div>
            </div>
            ${renderPapersGrid(group.visiblePapers, group.sec, true)}
          </div>`).join('') + renderPagination(totalItems);

    const first = visibleGroups[0]?.visiblePapers?.[0];

    if (first) setPreviewPaper(first);

    window.MathJax?.typesetPromise?.([listPane]).catch(() => {});
  }

  function setSectionColumns(sec, cols) {
    sectionColumns[sec] = cols;
    saveSettings();

    if (SAVED_TAB_CODES.has(selectedCategory)) {
      renderSavedView(selectedCategory);
      return;
    }

    if (window.__LAST_RENDER_META__) {
      renderSections(window.__LAST_RENDER_META__);
    }
  }

  /* Category tabs */

  function renderCategoryTabs() {
    const container = document.getElementById('categoryTabs');

    if (!container) return;

    container.innerHTML = '';

    for (const cat of CATEGORIES) {
      const tab = document.createElement('button');

      tab.className = `category-tab${cat.code === selectedCategory ? ' active' : ''}`;
      tab.textContent = cat.label;
      tab.setAttribute('aria-pressed', cat.code === selectedCategory);

      tab.onclick = () => {
        selectedCategory = cat.code;
        currentPage = 1;
        saveSettings();
        renderCategoryTabs();
        loadPapers();
      };

      container.appendChild(tab);
    }

    const savedTabs = [
      { code: TO_READ_TAB_CODE, icon: '⌛', label: 'To read', className: 'queue-tab', count: [...readingStates.values()].filter(state => state === 'queue').length },
      { code: READ_TAB_CODE, icon: '✓', label: 'Read', className: 'read-tab', count: [...readingStates.values()].filter(state => state === 'read').length },
      { code: FAV_TAB_CODE, icon: '⭐', label: 'Favorites', className: 'fav-tab', count: favorites.size }
    ];

    for (const item of savedTabs) {
      const tab = document.createElement('button');
      tab.className = `category-tab ${item.className}${selectedCategory === item.code ? ' active' : ''}`;
      tab.setAttribute('aria-pressed', selectedCategory === item.code);
      tab.innerHTML = `${item.icon} ${item.label} <span class="fav-count-badge">${item.count}</span>`;
      tab.onclick = () => {
        selectedCategory = item.code;
        currentPage = 1;
        saveSettings();
        renderCategoryTabs();
        renderSavedView(item.code);
      };
      container.appendChild(tab);
    }
  }

  function applySearch(query) {
    searchQuery = query.trim();
    currentPage = 1;

    document.getElementById('searchClear')?.classList.toggle('visible', searchQuery.length > 0);

    if (SAVED_TAB_CODES.has(selectedCategory)) {
      renderSavedView(selectedCategory);
      return;
    }

    if (window.__LAST_RENDER_META__) {
      renderSections(window.__LAST_RENDER_META__);
    }
  }

  function applyAdvancedFilters() {
    sortMode = document.getElementById('sortMode').value;
    categoryFilter = document.getElementById('categoryFilter').value;
    readingFilter = document.getElementById('readingFilter').value;
    imageFilter = document.getElementById('imageFilter').value;
    currentPage = 1;
    const count = [categoryFilter !== 'all', readingFilter !== 'all', imageFilter !== 'all', sortMode !== 'date-desc'].filter(Boolean).length;
    document.getElementById('filterCount').textContent = count ? String(count) : '';
    saveSettings();
    rerenderCurrentView();
  }

  function syncAdvancedFilterControls() {
    document.getElementById('sortMode').value = sortMode;
    document.getElementById('categoryFilter').value = categoryFilter;
    document.getElementById('readingFilter').value = readingFilter;
    document.getElementById('imageFilter').value = imageFilter;
    const count = [categoryFilter !== 'all', readingFilter !== 'all', imageFilter !== 'all', sortMode !== 'date-desc'].filter(Boolean).length;
    document.getElementById('filterCount').textContent = count ? String(count) : '';
  }

  /* Main load */

  async function loadPapers() {
    currentPage = 1;
    if (SAVED_TAB_CODES.has(selectedCategory)) {
      renderSavedView(selectedCategory);
      return;
    }

    const generation = ++loadGeneration;
    const dateInput = document.getElementById('day');
    const selectedYmd = dateInput.value;

    if (!selectedYmd) {
      setStatus('Please select a date.');
      return;
    }

    try {
      const dateList = getDateList(selectedYmd, currentDateRange, customStartDate);

      document.getElementById('content').innerHTML = `
        <div class="progress-bar-wrap"><div class="progress-bar" id="progressBar"></div></div>
        <div class="content-split">
          <div>
            <div class="status" id="loadStatus">⏳ Loading cached data…</div>
            <div class="papers-grid cols-2">${renderSkeletons(6)}</div>
          </div>
          <div class="preview-panels">
            <div class="abstract-card"><div class="preview-muted">Loading…</div></div>
            <div class="pdf-card"><div class="preview-muted">Loading…</div></div>
          </div>
        </div>`;

      syncPreviewPanelVisibility();

      setProgress(5);

      // Same-origin static files are fast, cacheable and do not need a CORS
      // proxy. Load every requested date concurrently.
      let staticPayloads = await Promise.all(
        dateList.map(date => fetchStaticDay(selectedCategory, date))
      );

      if (generation !== loadGeneration) return;

      let cachedPayloads = staticPayloads.filter(Boolean);
      let missingDates = dateList.filter((_, index) => !staticPayloads[index]);
      let onDemandFetched = 0;
      const backgroundFigureDates = [];

      // Resume figure jobs left pending by a page reload or server restart.
      for (let index = 0; index < staticPayloads.length; index++) {
        if (staticPayloads[index]?.figuresStatus !== 'pending') continue;
        const pendingDate = dateList[index];
        try {
          const result = await requestOnDemandDay(selectedCategory, pendingDate);
          if (generation !== loadGeneration) return;
          if (['queued', 'figures'].includes(result?.figures?.phase)) {
            backgroundFigureDates.push(pendingDate);
          }
        } catch (error) {
          console.warn(`Could not resume figures for ${pendingDate}:`, error);
          break;
        }
      }

      // The Node preview server can create a missing cache file on demand. Do
      // this before the browser-only proxy fallback. Metadata is persisted and
      // displayed first; figure extraction continues in the server queue.
      for (const missingDate of [...missingDates]) {
        const loadStatus = document.getElementById('loadStatus');
        if (loadStatus) {
          loadStatus.textContent = `📡 ${missingDate} is not cached. Fetching it from arXiv…`;
        }

        try {
          const result = await requestOnDemandDay(selectedCategory, missingDate);
          if (generation !== loadGeneration) return;
          if (['queued', 'figures'].includes(result?.figures?.phase)) {
            backgroundFigureDates.push(missingDate);
          }

          const index = dateList.indexOf(missingDate);
          staticPayloads[index] = await fetchStaticDay(selectedCategory, missingDate);
          if (staticPayloads[index]) onDemandFetched++;
        } catch (error) {
          console.warn(`On-demand cache unavailable for ${missingDate}:`, error);
          // A plain static server or GitHub Pages has no API endpoint. Stop
          // probing it and retain the existing browser fallback below.
          if (error.serviceUnavailable) break;
        }
      }

      if (generation !== loadGeneration) return;
      cachedPayloads = staticPayloads.filter(Boolean);
      missingDates = dateList.filter((_, index) => !staticPayloads[index]);

      if (missingDates.length === 0) {
        const renderMeta = mergeStaticPayloads(
          cachedPayloads,
          selectedCategory,
          selectedYmd,
          dateList,
          { dataSource: onDemandFetched ? 'on-demand-cache' : 'static' }
        );

        indexPapers(renderMeta.papersBySection);
        window.__LAST_RENDER_META__ = renderMeta;
        setProgress(100);
        renderSections(renderMeta);
        backgroundFigureDates.forEach(date => {
          watchFigureEnrichment(selectedCategory, date, generation);
        });
        return;
      }

      const loadStatus = document.getElementById('loadStatus');
      if (loadStatus) {
        loadStatus.textContent = `⏳ Keeping ${cachedPayloads.length} cached day(s); fetching ${missingDates.length} missing day(s)…`;
      }

      const allIdsBySection = { new: [], cross: [], repl: [] };
      const seenIds = { new: new Set(), cross: new Set(), repl: new Set() };

      // Fetch catchup pages sequentially to avoid overwhelming public proxies.
      for (let i = 0; i < missingDates.length; i++) {
        const date = missingDates[i];
        const url = `https://arxiv.org/catchup/${encodeURIComponent(selectedCategory)}/${encodeURIComponent(date)}?abs=False`;

        try {
          const html = await fetchWithProxy(url, 'text/html');
          if (generation !== loadGeneration) return;
          const ids = parseCatchupByHeadings(html);

          for (const sec of SECTIONS) {
            for (const id of ids[sec]) {
              if (!seenIds[sec].has(id)) {
                seenIds[sec].add(id);
                allIdsBySection[sec].push({ id, date });
              }
            }
          }

        } catch (e) {
          console.warn(`Skipped ${date}:`, e);
        }

        setProgress(5 + Math.round(((i + 1) / missingDates.length) * 30));
      }

      setProgress(35);

      const totalCatchupIds = SECTIONS.reduce((sum, sec) => {
        return sum + allIdsBySection[sec].length;
      }, 0);

      let livePapersBySection = Object.fromEntries(SECTIONS.map(sec => [sec, []]));
      let fallbackUsed = false;

      // Fallback to arXiv API only for the dates that were absent from cache.
      if (totalCatchupIds === 0) {
        console.warn('Catchup returned 0 papers. Using arXiv API fallback.');

        setProgress(45);

        const fallbackPapers = await fetchPapersByApiFallback(selectedCategory, missingDates);
        if (generation !== loadGeneration) return;
        livePapersBySection.new = fallbackPapers;
        fallbackUsed = true;
      } else {
        // Fetch unique metadata in one batched pass, then distribute it back to
        // the three sections. This avoids three independent proxy sequences.
        const uniqueIds = [...new Set(
          SECTIONS.flatMap(sec => allIdsBySection[sec].map(item => normalizeId(item.id)))
        )];
        const byId = await fetchPapersForIds(uniqueIds);
        if (generation !== loadGeneration) return;

        for (const sec of SECTIONS) {
          for (const item of allIdsBySection[sec]) {
            const p = byId.get(normalizeId(item.id));

            if (p) {
              p.catchupDate = item.date;
              livePapersBySection[sec].push(p);
            }
          }
        }
      }

      setProgress(95);

      const livePayload = {
        category: selectedCategory,
        date: selectedYmd,
        papersBySection: livePapersBySection
      };
      const renderMeta = mergeStaticPayloads(
        [...cachedPayloads, livePayload],
        selectedCategory,
        selectedYmd,
        dateList,
        {
          fallbackUsed,
          cacheMissDates: missingDates,
          dataSource: cachedPayloads.length ? 'partial-cache' : 'live'
        }
      );

      indexPapers(renderMeta.papersBySection);
      window.__LAST_RENDER_META__ = renderMeta;

      setProgress(100);
      renderSections(renderMeta);
      backgroundFigureDates.forEach(date => {
        watchFigureEnrichment(selectedCategory, date, generation);
      });

    } catch (e) {
      if (generation !== loadGeneration) return;
      console.error('Load failed:', e);

      document.getElementById('content').innerHTML = `
        <div class="error">❌ Failed to load papers: ${escapeHtml(e.message)}<br/>
        This is usually a CORS/proxy issue. Try refreshing or switching networks.</div>`;
    }
  }

  function setStatus(msg) {
    document.getElementById('content').innerHTML = `<div class="status">${msg}</div>`;
  }

  /* Event delegation */

  document.addEventListener('click', e => {
    if (e.target?.closest?.('a, button, .paper-visual')) return;

    const card = e.target?.closest?.('.paper-card');
    if (!card) return;

    const p = window.__PAPER_BY_ID__?.get?.(card.getAttribute('data-absid'));
    if (p) openPaperQuickView(p, card);
  });

  document.addEventListener('focusin', e => {
    const card = e.target?.closest?.('.paper-card');
    if (!card) return;

    const p = window.__PAPER_BY_ID__?.get?.(card.getAttribute('data-absid'));
    if (p) setPreviewPaper(p);
  });

  document.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;

    const card = e.target?.closest?.('.paper-card');
    if (!card) return;

    e.preventDefault();

    const p = window.__PAPER_BY_ID__?.get?.(card.getAttribute('data-absid'));
    if (p) openPaperQuickView(p, card);
  });

  document.getElementById('paperQuickViewClose').addEventListener('click', () => closePaperQuickView());
  document.getElementById('paperQuickView').addEventListener('click', event => {
    if (event.target.id === 'paperQuickView') closePaperQuickView();
  });

  /* Settings panel */

  const settingsWrap = document.getElementById('settingsWrap');
  const settingsButton = document.getElementById('settingsButton');
  const settingsPanel = document.getElementById('settingsPanel');

  function setSettingsOpen(open) {
    settingsPanel.hidden = !open;
    settingsButton.setAttribute('aria-expanded', String(open));
  }

  function loadPdfPreview(absId) {
    const paper = window.__PAPER_BY_ID__?.get(absId);
    const pdfPane = document.getElementById('pdfPane');
    if (!paper || !pdfPane) return;
    const pdfUrl = `https://arxiv.org/pdf/${paper.absId}.pdf`;
    pdfPane.innerHTML = `
      <div class="pdf-section-title">
        <span>📄 PDF Preview</span>
        <div class="pdf-actions">
          <a class="pdf-btn secondary" href="${escapeHtml(pdfUrl)}" target="_blank" rel="noopener">Open in New Tab</a>
        </div>
      </div>
      <div class="pdf-viewer-container">
        <iframe class="pdf-iframe" src="${escapeHtml(pdfUrl)}#view=FitH" title="PDF Preview"></iframe>
      </div>`;
  }

  settingsButton.addEventListener('click', () => {
    setSettingsOpen(settingsPanel.hidden);
  });

  document.addEventListener('click', e => {
    if (!settingsPanel.hidden && !settingsWrap.contains(e.target)) {
      setSettingsOpen(false);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && !settingsPanel.hidden) {
      setSettingsOpen(false);
      settingsButton.focus();
    }
  });

  /* PDF toggle */

  document.getElementById('pdfPreviewToggle').addEventListener('change', () => {
    saveSettings();

    if (currentSelectedCard) {
      const p = window.__PAPER_BY_ID__?.get?.(currentSelectedCard.getAttribute('data-absid'));
      if (p) setPreviewPaper(p);
    }
  });

  document.getElementById('previewPanelToggle').addEventListener('change', () => {
    syncPreviewPanelVisibility();
    saveSettings();
  });

  document.getElementById('pageSizeSelect').addEventListener('change', event => {
    const nextSize = Number(event.target.value);
    if (![12, 24, 48].includes(nextSize)) return;
    pageSize = nextSize;
    currentPage = 1;
    saveSettings();
    rerenderCurrentView();
  });

  /* Search */

  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  let searchDebounce = null;

  searchInput.addEventListener('input', () => {
    clearTimeout(searchDebounce);
    searchDebounce = setTimeout(() => applySearch(searchInput.value), 250);
  });

  searchClear.addEventListener('click', () => {
    searchInput.value = '';
    applySearch('');
    searchInput.focus();
  });

  /* Advanced filters */

  const filtersButton = document.getElementById('filtersButton');
  const filterPanel = document.getElementById('filterPanel');

  filtersButton.addEventListener('click', () => {
    const open = filterPanel.hidden;
    filterPanel.hidden = !open;
    filtersButton.setAttribute('aria-expanded', String(open));
  });

  ['sortMode', 'categoryFilter', 'readingFilter', 'imageFilter'].forEach(id => {
    document.getElementById(id).addEventListener('change', applyAdvancedFilters);
  });

  document.getElementById('resetFilters').addEventListener('click', () => {
    sortMode = 'date-desc';
    categoryFilter = 'all';
    readingFilter = 'all';
    imageFilter = 'all';
    currentPage = 1;
    syncAdvancedFilterControls();
    saveSettings();
    rerenderCurrentView();
  });

  /* Figure gallery */

  ['figureClose', 'figureCloseBottom'].forEach(id => {
    document.getElementById(id).addEventListener('click', closeFigureGallery);
  });
  document.getElementById('figurePrev').addEventListener('click', () => {
    if (galleryIndex > 0) { galleryIndex--; updateFigureGallery(); }
  });
  document.getElementById('figureNext').addEventListener('click', () => {
    if (galleryIndex < paperFigures(galleryPaper).length - 1) { galleryIndex++; updateFigureGallery(); }
  });
  document.getElementById('figureZoomToggle').addEventListener('click', () => {
    setFigureZoomMode(galleryZoomMode === 'fit' ? 'actual' : 'fit');
  });
  document.getElementById('figureModal').addEventListener('click', e => {
    if (e.target.id === 'figureModal') closeFigureGallery();
  });
  document.addEventListener('keydown', e => {
    const figureModalOpen = !document.getElementById('figureModal').hidden;
    const quickViewOpen = !document.getElementById('paperQuickView').hidden;
    if (e.key === 'Escape' && figureModalOpen) closeFigureGallery();
    else if (e.key === 'Escape' && quickViewOpen) closePaperQuickView();
    if (!figureModalOpen) return;
    if (e.key === 'ArrowLeft' && galleryIndex > 0) { galleryIndex--; updateFigureGallery(); }
    if (e.key === 'ArrowRight' && galleryIndex < paperFigures(galleryPaper).length - 1) { galleryIndex++; updateFigureGallery(); }
  });

  /* Back to top */

  const backToTopBtn = document.getElementById('backToTop');

  window.addEventListener('scroll', () => {
    backToTopBtn.style.display = window.scrollY > 500 ? 'flex' : 'none';
  }, { passive: true });

  backToTopBtn.addEventListener('click', () => {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  /* Init */

  window.addEventListener('DOMContentLoaded', async () => {
    loadFavorites();
    loadReadingStates();

    const saved = loadSettings();
    if (saved) applySettings(saved);

    const categorySelect = document.getElementById('categoryFilter');
    for (const cat of CATEGORIES.slice(1)) {
      const option = document.createElement('option');
      option.value = cat.code;
      option.textContent = cat.label;
      categorySelect.appendChild(option);
    }
    syncAdvancedFilterControls();
    renderCategoryTabs();

    const latestCategory = SAVED_TAB_CODES.has(selectedCategory) ? 'astro-ph' : selectedCategory;
    const latestPayload = await fetchLatestStatic(latestCategory);
    document.getElementById('day').value = latestPayload?.date || defaultArxivDate();
    const rangeStartInput = document.getElementById('rangeStart');
    rangeStartInput.max = document.getElementById('day').value;
    if (currentDateRange === 'custom' && !rangeStartInput.value) {
      rangeStartInput.value = offsetDate(document.getElementById('day').value, -6);
      customStartDate = rangeStartInput.value;
    }

    document.getElementById('day').addEventListener('change', function () {
      if (isWeekend(this.value)) {
        this.value = prevFriday(this.value);
      }

      rangeStartInput.max = this.value;
      if (rangeStartInput.value > this.value) {
        rangeStartInput.value = this.value;
        customStartDate = this.value;
      }

      loadPapers();
    });

    rangeStartInput.addEventListener('change', function () {
      customStartDate = this.value;
      saveSettings();
      if (currentDateRange === 'custom') loadPapers();
    });

    loadPapers();
  });
</script>
</body>
</html>
