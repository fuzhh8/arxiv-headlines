<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>arXiv Headlines</title>
  <script>
    MathJax = {
      tex: { inlineMath: [['$','$'],['\\(','\\)']], displayMath: [['$$','$$'],['\\[','\\]']] },
      svg: { fontCache: 'global' }
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" async></script>
  <script src="config.js"></script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --c1:#667eea; --c2:#764ba2; --card-shadow2:rgba(118,75,162,.3); }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh; padding: 16px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      background: linear-gradient(135deg, var(--c1) 0%, var(--c2) 100%);
      transition: background .3s ease;
    }

    body.theme-purple { --c1:#667eea; --c2:#764ba2; --card-shadow2:rgba(118,75,162,.3); }
    body.theme-ocean  { --c1:#2E3192; --c2:#1BFFFF; --card-shadow2:rgba(27,255,255,.3); }
    body.theme-sunset { --c1:#FF512F; --c2:#F09819; --card-shadow2:rgba(240,152,25,.3); }
    body.theme-forest { --c1:#134E5E; --c2:#71B280; --card-shadow2:rgba(113,178,128,.3); }
    body.theme-night  { --c1:#2C3E50; --c2:#4CA1AF; --card-shadow2:rgba(76,161,175,.3); }
    body.theme-rose   { --c1:#ED4264; --c2:#FFEDBC; --card-shadow2:rgba(255,237,188,.3); }
    body.theme-dark   { --c1:#0F0F0F; --c2:#2D2D2D; --card-shadow2:rgba(15,15,15,.5); }

    .abstract-card, .pdf-card {
      border: 3px solid var(--c1);
      box-shadow: -4px -4px 0 0 var(--c2), -8px -8px 0 0 var(--card-shadow2), 0 10px 30px rgba(0,0,0,.18);
    }

    .theme-pill {
      position: absolute;
      top: 16px; right: 16px;
      display: flex;
      align-items: center;
      gap: 7px;
      background: rgba(255,255,255,.18);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(255,255,255,.35);
      border-radius: 999px;
      padding: 7px 14px;
      box-shadow: 0 4px 18px rgba(0,0,0,.18);
      transition: background .2s;
    }

    .theme-pill:hover { background: rgba(255,255,255,.26); }
    .theme-pill-label {
      color: rgba(255,255,255,.85);
      font-size: .78em; font-weight: 700;
      letter-spacing: .04em; text-transform: uppercase;
      white-space: nowrap;
    }
    .theme-dot {
      width: 22px; height: 22px; border-radius: 50%;
      cursor: pointer; border: 2.5px solid transparent;
      transition: transform .18s, border-color .18s;
      flex-shrink: 0;
    }
    .theme-dot:hover { transform: scale(1.2); }
    .theme-dot.active { border-color: #fff; box-shadow: 0 0 0 2px rgba(255,255,255,.45); }
    .theme-dot.purple { background: linear-gradient(135deg,#667eea,#764ba2); }
    .theme-dot.ocean  { background: linear-gradient(135deg,#2E3192,#1BFFFF); }
    .theme-dot.sunset { background: linear-gradient(135deg,#FF512F,#F09819); }
    .theme-dot.forest { background: linear-gradient(135deg,#134E5E,#71B280); }
    .theme-dot.night  { background: linear-gradient(135deg,#2C3E50,#4CA1AF); }
    .theme-dot.rose   { background: linear-gradient(135deg,#ED4264,#FFEDBC); }
    .theme-dot.dark   { background: linear-gradient(135deg,#0F0F0F,#2D2D2D); }

    .layout { max-width: 1600px; margin: 0 auto; }
    .main { padding: 18px; }

    .header {
      padding: 18px 18px 14px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      color: #fff; font-size: 2.8em; font-weight: 900;
      letter-spacing: -.02em;
      text-shadow: 0 4px 12px rgba(0,0,0,.3);
    }

    .category-tabs {
      display: flex; gap: 4px; flex-wrap: nowrap; overflow-x: auto;
      align-items: flex-end; margin-bottom: 12px; padding-bottom: 3px;
      scrollbar-width: none; overscroll-behavior-inline: contain;
      scroll-snap-type: x proximity;
    }
    .category-tabs::-webkit-scrollbar { display: none; }
    .category-tab {
      flex: 0 0 auto; scroll-snap-align: start;
      background: rgba(255,255,255,.15); backdrop-filter: blur(8px);
      border: 2px solid rgba(255,255,255,.25); border-bottom: none;
      border-radius: 12px 12px 0 0; padding: 12px 20px;
      color: rgba(255,255,255,.85); font-weight: 700; font-size: .92em;
      cursor: pointer; transition: all .2s ease; white-space: nowrap; user-select: none;
    }
    .category-tab:hover { background: rgba(255,255,255,.25); color: #fff; transform: translateY(-2px); }
    .category-tab.active {
      background: #fff; color: var(--c1); border-color: #fff;
      font-weight: 800; position: relative;
    }
    .category-tab.active::after {
      content: ''; position: absolute;
      bottom: -2px; left: 0; right: 0; height: 2px; background: #fff;
    }
    .category-tab.fav-tab { border-color: rgba(255,200,0,.5); color: rgba(255,220,50,.95); }
    .category-tab.fav-tab.active { background: #fff; color: #e6a800; border-color: #fff; }
    .fav-count-badge {
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(255,200,0,.3); color: #fff;
      border-radius: 999px; font-size: .75em; font-weight: 900;
      min-width: 18px; height: 18px; padding: 0 5px; margin-left: 4px;
    }
    .category-tab.fav-tab.active .fav-count-badge { background: rgba(230,168,0,.2); color: #e6a800; }

    .controls {
      background: #fff; padding: 14px; border-radius: 16px;
      box-shadow: 0 5px 15px rgba(0,0,0,.10);
      margin-bottom: 12px; display: grid; gap: 12px;
      grid-template-columns: minmax(230px, 280px) minmax(610px, 1fr) minmax(240px, 340px) auto;
      align-items: center;
    }
    .controls .group { display: flex; gap: 10px; align-items: center; min-width: 0; }
    label { color: #555; font-size: .95em; font-weight: 700; white-space: nowrap; }

    select, input[type="date"] {
      padding: 10px 14px; border-radius: 10px;
      border: 2px solid var(--c1); font-size: 1em;
      background: #fff; width: 100%; font-weight: 600;
      cursor: pointer; transition: border-color .2s;
    }
    select:focus, input[type="date"]:focus { outline: none; border-color: var(--c2); }

    .search-wrap { position: relative; flex: 1.5; min-width: 200px; }
    .search-icon {
      position: absolute; left: 12px; top: 50%;
      transform: translateY(-50%); font-size: 1em; pointer-events: none; opacity: .5;
    }
    .search-wrap input[type="text"] {
      padding: 10px 36px 10px 36px; border-radius: 10px;
      border: 2px solid var(--c1); font-size: 1em;
      background: #fff; width: 100%; font-weight: 500;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-wrap input[type="text"]:focus {
      outline: none; border-color: var(--c2);
      box-shadow: 0 0 0 3px rgba(102,126,234,.15);
    }
    .search-clear {
      position: absolute; right: 10px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      font-size: 1em; color: #aaa; padding: 2px 4px;
      min-width: unset; display: none; transition: color .15s;
    }
    .search-clear:hover { color: #555; transform: translateY(-50%); box-shadow: none; }
    .search-clear.visible { display: block; }

    button {
      padding: 10px 14px; border-radius: 10px;
      border: 2px solid var(--c1); font-size: 1em;
      cursor: pointer; transition: all .2s ease;
      background: var(--c1); color: #fff; font-weight: 850; min-width: 120px;
    }
    button:hover:not(:disabled) {
      filter: brightness(1.1); transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(0,0,0,.2);
    }
    button:disabled { background: #b7b7b7; border-color: #b7b7b7; cursor: not-allowed; }

    .range-toggle { display: flex; flex-wrap: nowrap; gap: 8px; align-items: center; min-width: 0; }
    .range-btn {
      padding: 10px 16px; border-radius: 10px;
      border: 2px solid var(--c1); background: #fff;
      color: var(--c1); font-size: .9em; font-weight: 700;
      cursor: pointer; transition: all .2s ease; min-width: 80px;
    }
    .range-btn:hover { background: #f2f5ff; }
    .range-btn.active { background: var(--c1); color: #fff; }
    .custom-start-wrap {
      display: flex; flex: 1 1 220px; align-items: center; gap: 8px; padding: 0;
      color: var(--muted); font-size: .82em;
    }
    .custom-start-wrap[hidden] { display: none; }
    .custom-start-wrap input { min-width: 145px; }

    .pdf-toggle {
      display: inline-flex; align-items: center; gap: 6px;
      cursor: pointer; user-select: none;
      font-size: .9em; color: var(--c1); font-weight: 700;
    }
    .pdf-toggle input { width: 16px; height: 16px; cursor: pointer; }
    .panel-toggle-stack {
      display: flex; flex-direction: column; align-items: flex-start;
      gap: 6px; flex: 0 0 auto; padding: 2px 4px;
    }
    .pdf-toggle.is-disabled { opacity: .42; cursor: not-allowed; }
    .pdf-toggle.is-disabled input { cursor: not-allowed; }

    .status {
      background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.35);
      color: rgba(255,255,255,.95); padding: 12px 14px;
      border-radius: 14px; margin-bottom: 14px; line-height: 1.5;
    }
    .error { background: #fff1f1; color: #b3261e; padding: 14px; border-radius: 14px; margin: 14px 0; line-height: 1.6; white-space: pre-wrap; }
    .info  { background: #e3f2fd; color: #1565c0; padding: 14px; border-radius: 14px; margin: 14px 0; line-height: 1.6; font-weight: 600; }

    .progress-bar-wrap {
      width: 100%; height: 4px; background: rgba(255,255,255,.2);
      border-radius: 999px; overflow: hidden; margin-bottom: 10px;
    }
    .progress-bar {
      height: 100%; background: #fff;
      border-radius: 999px;
      transition: width .3s ease;
      width: 0%;
    }

    .section { margin-bottom: 18px; }
    .section-title {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 12px; border-radius: 14px;
      background: rgba(255,255,255,.22); border: 1px solid rgba(255,255,255,.35);
      color: rgba(255,255,255,.95); margin-bottom: 10px; gap: 10px; flex-wrap: wrap;
    }
    .section-title .left { display: flex; gap: 10px; align-items: center; font-weight: 850; }
    .section-title .right { display: flex; gap: 8px; align-items: center; }
    .pill {
      background: rgba(255,255,255,.25); border: 1px solid rgba(255,255,255,.35);
      padding: 4px 10px; border-radius: 999px; font-weight: 750;
    }

    .papers-grid { display: grid; gap: 18px; width: 100%; margin-bottom: 8px; }
    .papers-grid.cols-1 { grid-template-columns: 1fr; }
    .papers-grid.cols-2 { grid-template-columns: repeat(2, 1fr); }

    .paper-card {
      background: #fff; border-radius: 14px;
      padding: 20px 18px 18px 22px;
      box-shadow: 0 5px 16px rgba(0,0,0,.10);
      transition: transform .25s, box-shadow .25s;
      cursor: pointer; position: relative; overflow: hidden;
      display: flex; flex-direction: column; border: 3px solid transparent;
    }
    .paper-card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(0,0,0,.18); }
    .paper-card.selected { border-color: var(--c1); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
    .paper-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%;
      background: linear-gradient(180deg, var(--c1) 0%, var(--c2) 100%);
    }
    .paper-card:focus-visible { outline: 3px solid rgba(102,126,234,.45); outline-offset: 2px; }
    .paper-card.favorited { border-color: #f5c518 !important; }
    .paper-card.favorited::before { background: linear-gradient(180deg,#f5c518,#e6a800) !important; }
    .paper-card.search-match .paper-title mark,
    .paper-card.search-match .paper-authors mark {
      background: rgba(255,220,0,.45); border-radius: 2px; padding: 0 1px;
    }

    .paper-visual {
      height: 180px; margin: -20px -18px 16px -22px;
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, #eef1ff, #f8f4ff);
      border-bottom: 1px solid #e5e7ef;
      display: flex; align-items: center; justify-content: center;
    }
    .paper-visual img {
      width: 100%; height: 100%; object-fit: contain;
      display: block; background: #f7f8fb;
      transition: transform .3s ease;
    }
    .paper-card:hover .paper-visual img { transform: scale(1.025); }
    .paper-visual-placeholder {
      color: var(--c1); font-weight: 900; letter-spacing: .04em;
      font-size: 1.05em;
    }
    .paper-visual.has-image .paper-visual-placeholder { display: none; }
    .paper-visual.has-image.image-error .paper-visual-placeholder { display: block; }

    .paper-title   { color: #222; font-size: 1.05em; font-weight: 900; margin-bottom: 10px; line-height: 1.4; }
    .paper-authors { color: #666; font-size: .88em; margin-bottom: 10px; font-style: italic; }
    .paper-date    { color: #999; font-size: .82em; margin-bottom: 10px; font-weight: 600; }
    .paper-footer  { margin-top: auto; display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .paper-link    { color: #465bd6; text-decoration: none; font-weight: 900; font-size: .92em; }
    .paper-link:hover { text-decoration: underline; }

    .fav-btn {
      margin-left: auto; background: none; border: none;
      font-size: 1.25em; cursor: pointer; padding: 2px 4px; border-radius: 6px;
      transition: transform .15s, filter .15s; min-width: unset;
      line-height: 1; opacity: .35; filter: grayscale(1);
    }
    .fav-btn:hover { transform: scale(1.25) !important; box-shadow: none !important; filter: grayscale(0); opacity: .7; }
    .fav-btn.active { opacity: 1; filter: grayscale(0); transform: scale(1.1); }

    .preview-abstract mark, .preview-title mark {
      background: rgba(255,220,0,.45); border-radius: 2px; padding: 0 1px;
    }

    .paper-quickview {
      position: fixed; inset: 0; z-index: 900; display: grid; place-items: center;
      padding: 24px; background: rgba(0,3,12,.72); backdrop-filter: blur(12px);
    }
    .paper-quickview[hidden] { display: none; }
    .paper-quickview-dialog {
      width: min(780px, calc(100vw - 32px)); max-height: min(760px, calc(100dvh - 48px));
      display: flex; flex-direction: column; overflow: hidden;
      border: 1px solid var(--line-bright); border-radius: 16px;
      background: linear-gradient(155deg, rgba(11,22,47,.99), rgba(3,8,20,.99));
      box-shadow: 0 28px 80px rgba(0,0,0,.58), 0 0 42px color-mix(in srgb, var(--c1) 18%, transparent);
    }
    .paper-quickview-head {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 13px 16px; border-bottom: 1px solid var(--line);
      color: var(--cyan); font-size: .78em; font-weight: 850; letter-spacing: .09em;
      text-transform: uppercase;
    }
    .paper-quickview-close { min-width: 40px; padding: 8px; }
    .paper-quickview-body { padding: 20px; overflow: auto; overscroll-behavior: contain; }
    .paper-quickview-links { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 16px; }

    .content-split { display: grid; grid-template-columns: 5fr 5fr; gap: 16px; align-items: start; }
    .content-split.panel-hidden { grid-template-columns: minmax(0, 1fr); }
    .content-split.panel-hidden .preview-panels { display: none; }
    .content-split.panel-hidden .papers-grid.cols-1,
    .content-split.panel-hidden .papers-grid.cols-2 {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    @media (max-width: 1150px) { .content-split { grid-template-columns: 1fr; } }
    @media (max-width: 900px) {
      .content-split.panel-hidden .papers-grid.cols-1,
      .content-split.panel-hidden .papers-grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    @media (max-width: 560px) {
      .content-split.panel-hidden .papers-grid.cols-1,
      .content-split.panel-hidden .papers-grid.cols-2 { grid-template-columns: 1fr; }
    }

    .preview-panels {
      display: flex; flex-direction: column; gap: 16px;
      position: sticky; top: 16px;
      height: calc(100vh - 32px); max-height: calc(100vh - 32px);
    }
    @media (max-width: 1150px) { .preview-panels { position: static; height: auto; max-height: none; } }

    .abstract-card {
      background: #fff; border-radius: 16px; padding: 16px;
      overflow-y: auto; flex: 2.5 0 0; min-height: 0;
    }
    .pdf-card {
      background: #fff; border-radius: 16px; padding: 16px;
      flex: 2 0 0; min-height: 0; display: flex; flex-direction: column; gap: 12px;
    }

    .preview-muted   { color: #666; font-size: .95em; line-height: 1.6; }
    .preview-title   { font-size: 1.3em; font-weight: 950; color: #222; line-height: 1.35; margin-bottom: 10px; }
    .preview-meta    { color: #666; font-size: .92em; margin-bottom: 10px; line-height: 1.5; font-style: italic; }
    .preview-abstract{ color: #333; font-size: 1em; line-height: 1.65; white-space: pre-wrap; word-break: break-word; padding-right: 6px; }

    .pdf-section-title {
      font-size: 1.1em; font-weight: 800; color: #333;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-shrink: 0;
    }
    .pdf-actions { display: flex; gap: 8px; }
    .pdf-btn {
      padding: 6px 12px; background: var(--c1); color: #fff;
      border: none; border-radius: 6px; cursor: pointer;
      font-size: .85em; font-weight: 700; transition: all .2s;
      text-decoration: none; display: inline-block;
    }
    .pdf-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .pdf-btn.secondary { background: #e8edff; color: #465bd6; }
    .pdf-btn.secondary:hover { background: #d0dcff; }

    .pdf-viewer-container {
      width: 100%; flex: 1; border: 2px solid #e0e0e0;
      border-radius: 8px; overflow: hidden; background: #f5f5f5; min-height: 0;
    }
    .pdf-iframe { width: 100%; height: 100%; border: none; display: block; }

    .back-to-top {
      position: fixed; left: 16px; bottom: 16px;
      width: 52px; height: 52px; border-radius: 999px;
      border: 2px solid rgba(255,255,255,.45);
      background: rgba(32,32,32,.45); color: #fff;
      font-weight: 950; box-shadow: 0 12px 28px rgba(0,0,0,.28);
      cursor: pointer; display: none; align-items: center; justify-content: center;
      backdrop-filter: blur(6px); transition: background .2s; min-width: unset;
    }
    .back-to-top:hover { background: rgba(32,32,32,.62); }

    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg,#f0f0f0 25%,#e0e0e0 50%,#f0f0f0 75%);
      background-size: 600px 100%; animation: shimmer 1.4s infinite; border-radius: 8px;
    }
    .skeleton-card {
      background: #fff; border-radius: 14px; padding: 20px 18px 18px 22px;
      box-shadow: 0 5px 16px rgba(0,0,0,.10);
      display: flex; flex-direction: column; gap: 10px;
      position: relative; overflow: hidden;
    }
    .skeleton-card::before {
      content: ''; position: absolute; top: 0; left: 0; width: 5px; height: 100%; background: #e0e0e0;
    }
    .sk-title  { height: 18px; width: 85%; }
    .sk-author { height: 13px; width: 55%; }
    .sk-date   { height: 12px; width: 30%; }
    .sk-link   { height: 14px; width: 40%; margin-top: 8px; }

    .fav-empty { text-align: center; padding: 48px 24px; color: rgba(255,255,255,.7); }
    .fav-empty .fav-empty-icon { font-size: 3em; margin-bottom: 12px; }
    .fav-empty p { font-size: 1.05em; font-weight: 600; }
    .search-no-results { text-align: center; padding: 32px 16px; color: rgba(255,255,255,.75); font-size: 1em; font-weight: 600; }

    /* Cosmic command-deck visual system */
    :root {
      --space-0: #02040c;
      --space-1: #07101f;
      --space-2: #0b1730;
      --panel: rgba(7, 15, 34, .78);
      --panel-strong: rgba(9, 18, 40, .94);
      --panel-soft: rgba(17, 31, 61, .68);
      --line: rgba(143, 208, 255, .18);
      --line-bright: rgba(143, 226, 255, .48);
      --ink: #edf8ff;
      --muted: #91a9bd;
      --cyan: #75e7ff;
    }

    html { background: var(--space-0); color-scheme: dark; }
    body {
      color: var(--ink);
      background: transparent;
      letter-spacing: .005em;
    }
    body::before {
      z-index: -2;
      background:
        radial-gradient(circle at 12% 18%, color-mix(in srgb, var(--c1) 38%, transparent) 0, transparent 28%),
        radial-gradient(circle at 88% 8%, color-mix(in srgb, var(--c2) 26%, transparent) 0, transparent 25%),
        radial-gradient(circle at 70% 78%, color-mix(in srgb, var(--c1) 18%, transparent) 0, transparent 32%),
        linear-gradient(145deg, #02040c 0%, #071126 45%, #030611 100%);
    }
    body::after {
      content: '';
      position: fixed; inset: -100px; z-index: -1; pointer-events: none;
      opacity: .62;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.9) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(117,231,255,.75) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(177,142,255,.65) 0 1.2px, transparent 1.8px);
      background-size: 173px 173px, 257px 257px, 389px 389px;
      background-position: 17px 31px, 91px 143px, 211px 53px;
      animation: star-drift 90s linear infinite;
    }

    body.theme-purple { --c1:#8b7cff; --c2:#27d8ff; --card-shadow2:rgba(102,103,255,.34); }
    body.theme-ocean  { --c1:#3b9dff; --c2:#20f0d0; --card-shadow2:rgba(32,240,208,.28); }
    body.theme-sunset { --c1:#ff648d; --c2:#ffb34a; --card-shadow2:rgba(255,100,141,.30); }
    body.theme-forest { --c1:#2ad7a2; --c2:#a0f06b; --card-shadow2:rgba(42,215,162,.28); }
    body.theme-night  { --c1:#708cff; --c2:#6fe6ff; --card-shadow2:rgba(111,230,255,.27); }
    body.theme-rose   { --c1:#ff62bd; --c2:#b87cff; --card-shadow2:rgba(255,98,189,.28); }
    body.theme-dark   { --c1:#91a8c5; --c2:#d6e4f3; --card-shadow2:rgba(145,168,197,.22); }
    body.theme-newspaper { --c1:#111; --c2:#555; --card-shadow2:rgba(0,0,0,.22); }

    .layout { max-width: 1680px; }
    .header {
      min-height: 132px; padding: 26px 18px 22px;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
    }
    .header::before {
      content: ''; position: absolute; left: 50%; top: 50%;
      width: min(560px, 80vw); height: 82px; transform: translate(-50%, -44%);
      border: 1px solid color-mix(in srgb, var(--c2) 28%, transparent);
      border-radius: 50%; opacity: .55; pointer-events: none;
      box-shadow: 0 0 45px color-mix(in srgb, var(--c1) 16%, transparent);
    }
    .header-kicker {
      color: var(--cyan); font-size: .68em; font-weight: 800;
      letter-spacing: .34em; text-transform: uppercase; margin-bottom: 8px;
      text-shadow: 0 0 14px rgba(117,231,255,.55);
    }
    .header h1 {
      position: relative; color: var(--ink); font-size: clamp(2.2em, 5vw, 3.5em);
      font-weight: 900; letter-spacing: .09em; text-transform: uppercase;
      text-shadow: 0 0 12px rgba(117,231,255,.28), 0 0 34px color-mix(in srgb, var(--c1) 32%, transparent);
    }
    .header h1 span { color: var(--cyan); }
    .header-subtitle {
      color: var(--muted); margin-top: 7px; font-size: .8em;
      letter-spacing: .12em; text-transform: uppercase;
    }

    .theme-pill, .controls, .section-title, .status {
      background: linear-gradient(135deg, rgba(16,31,61,.78), rgba(5,12,29,.82));
      border: 1px solid var(--line);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 12px 40px rgba(0,0,0,.22);
      backdrop-filter: blur(18px) saturate(135%);
    }
    .theme-pill { border-radius: 12px; }
    .theme-pill:hover { background: rgba(20,38,72,.9); border-color: var(--line-bright); }
    .theme-pill-label, .status, .section-title { color: var(--ink); }
    .theme-dot.active {
      border-color: var(--cyan);
      box-shadow: 0 0 0 2px rgba(117,231,255,.2), 0 0 16px rgba(117,231,255,.6);
    }

    .category-tabs { gap: 5px; align-items: center; }
    .category-tab {
      padding: 9px 9px; border: 1px solid var(--line); border-radius: 8px;
      background: rgba(7,15,34,.66); color: var(--muted);
      backdrop-filter: blur(12px); letter-spacing: .025em; font-size: .82em;
    }
    .category-tab:hover {
      background: rgba(18,35,66,.86); border-color: var(--line-bright);
      color: var(--ink); box-shadow: 0 0 18px color-mix(in srgb, var(--c2) 18%, transparent);
    }
    .category-tab.active {
      background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 26%, #0b1730), color-mix(in srgb, var(--c2) 18%, #07101f));
      color: #fff; border-color: color-mix(in srgb, var(--c2) 62%, transparent);
      box-shadow: inset 0 0 16px rgba(255,255,255,.035), 0 0 20px color-mix(in srgb, var(--c1) 24%, transparent);
    }
    .category-tab.active::after { display: none; }
    .category-tab.fav-tab.active { background: rgba(83,65,16,.8); color: #ffe37a; border-color: rgba(255,215,76,.55); }
    .category-tab.queue-tab { border-color: rgba(117,231,255,.38); color: #9ceeff; }
    .category-tab.read-tab { border-color: rgba(87,240,176,.38); color: #8ff0bd; }
    .category-tab.queue-tab.active { background: rgba(12,67,88,.82); border-color: #75e7ff; }
    .category-tab.read-tab.active { background: rgba(13,73,53,.82); border-color: #57f0b0; }

    .controls { border-radius: 12px; padding: 14px 16px; }
    label { color: #a9bed0; }
    select, input[type="date"], .search-wrap input[type="text"] {
      color: var(--ink); background: rgba(2,8,20,.82);
      border: 1px solid var(--line); border-radius: 7px;
      box-shadow: inset 0 1px 7px rgba(0,0,0,.45);
    }
    select:focus, input[type="date"]:focus, .search-wrap input[type="text"]:focus {
      border-color: var(--cyan); box-shadow: 0 0 0 2px rgba(117,231,255,.10), 0 0 18px rgba(117,231,255,.14);
    }
    .search-wrap input::placeholder { color: #607990; }
    .search-clear, .search-clear:hover { color: var(--muted); }
    input[type="checkbox"] { accent-color: var(--c2); }

    button, .range-btn {
      border: 1px solid color-mix(in srgb, var(--c1) 60%, transparent);
      background: linear-gradient(135deg, color-mix(in srgb, var(--c1) 72%, #0b1730), color-mix(in srgb, var(--c2) 42%, #07101f));
      color: #fff; border-radius: 7px;
    }
    button:hover:not(:disabled), .range-btn:hover {
      filter: brightness(1.16); box-shadow: 0 0 22px color-mix(in srgb, var(--c2) 26%, transparent);
    }
    .range-btn { background: rgba(4,12,28,.84); color: #a9c5dc; }
    .range-btn.active { color: #fff; border-color: var(--c2); }
    button:disabled { background: #263244; border-color: #36465d; color: #78889a; }
    .pdf-toggle { color: #a9c5dc; }

    .section-title { border-radius: 9px; padding: 9px 13px; }
    .section-title .left { letter-spacing: .045em; text-transform: uppercase; font-size: .88em; }
    .pill {
      background: rgba(117,231,255,.08); border-color: rgba(117,231,255,.2);
      color: var(--cyan); font-size: .84em;
    }

    .paper-card {
      background: linear-gradient(155deg, rgba(12,24,51,.96), rgba(5,11,27,.97));
      border: 1px solid var(--line); border-radius: 11px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 12px 32px rgba(0,0,0,.28);
    }
    .paper-card::before { width: 2px; box-shadow: 0 0 16px var(--c2); }
    .paper-card:hover {
      transform: translateY(-5px); border-color: var(--line-bright);
      box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 18px 42px rgba(0,0,0,.42), 0 0 22px color-mix(in srgb, var(--c1) 15%, transparent);
    }
    .paper-card.selected { border-color: var(--c2); box-shadow: 0 0 24px color-mix(in srgb, var(--c2) 25%, transparent); }
    .paper-visual {
      background: radial-gradient(circle at 50% 40%, rgba(25,49,87,.9), rgba(4,10,25,.96));
      border-bottom-color: var(--line);
    }
    .paper-visual img { background: #eef1f6; }
    .paper-visual-placeholder {
      color: var(--cyan); text-shadow: 0 0 16px rgba(117,231,255,.45);
      text-transform: uppercase; letter-spacing: .13em;
    }
    .paper-title { color: var(--ink); letter-spacing: .012em; }
    .paper-authors { color: #9bb0c3; }
    .paper-date { color: #6f899f; }
    .paper-link { color: var(--cyan); text-shadow: 0 0 12px rgba(117,231,255,.18); }
    .fav-btn { color: #ffe36e; }

    .abstract-card, .pdf-card {
      background: linear-gradient(155deg, rgba(11,22,47,.96), rgba(4,10,25,.97));
      border: 1px solid var(--line-bright); border-radius: 11px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.035), 0 18px 42px rgba(0,0,0,.34), 0 0 24px color-mix(in srgb, var(--c1) 12%, transparent);
    }
    .preview-title { color: var(--ink); }
    .preview-meta, .preview-muted { color: var(--muted); }
    .preview-abstract { color: #c8d9e6; }
    .pdf-section-title { color: var(--ink); }
    .pdf-btn.secondary { background: rgba(117,231,255,.10); color: var(--cyan); border: 1px solid rgba(117,231,255,.22); }
    .pdf-btn.secondary:hover { background: rgba(117,231,255,.18); }
    .pdf-viewer-container { border-color: var(--line); background: #07101f; }

    .info { background: rgba(14,48,72,.82); color: #aeeaff; border: 1px solid rgba(117,231,255,.2); }
    .error { background: rgba(82,20,38,.88); color: #ffc3d0; border: 1px solid rgba(255,105,139,.3); }
    .progress-bar { background: linear-gradient(90deg, var(--c1), var(--cyan)); box-shadow: 0 0 14px var(--cyan); }
    .skeleton-card { background: var(--panel-strong); border: 1px solid var(--line); }
    .skeleton { background: linear-gradient(90deg,#101c34 25%,#1d3152 50%,#101c34 75%); background-size: 600px 100%; }
    .back-to-top { border-color: var(--line-bright); background: rgba(5,13,30,.82); color: var(--cyan); }
    .back-to-top:hover { background: rgba(16,34,62,.94); box-shadow: 0 0 20px rgba(117,231,255,.24); }

    .settings-wrap { position: absolute; top: 16px; right: 16px; z-index: 30; }
    .settings-button {
      min-width: 0; padding: 8px 12px;
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(7,15,34,.82); border: 1px solid var(--line-bright);
      color: var(--ink); font-size: .8em; letter-spacing: .06em;
      backdrop-filter: blur(16px);
    }
    .settings-button[aria-expanded="true"] {
      border-color: var(--cyan); box-shadow: 0 0 20px rgba(117,231,255,.22);
    }
    .settings-panel {
      position: absolute; top: calc(100% + 9px); right: 0;
      width: min(300px, calc(100vw - 36px)); padding: 14px;
      border-radius: 11px; text-align: left;
      background: linear-gradient(155deg, rgba(13,27,55,.98), rgba(4,10,25,.98));
      border: 1px solid var(--line-bright);
      box-shadow: 0 22px 60px rgba(0,0,0,.52), 0 0 26px color-mix(in srgb, var(--c1) 16%, transparent);
      backdrop-filter: blur(22px) saturate(140%);
    }
    .settings-panel[hidden] { display: none; }
    .settings-section + .settings-section {
      margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--line);
    }
    .settings-heading {
      margin-bottom: 9px; color: #7892aa; font-size: .65em;
      font-weight: 900; letter-spacing: .18em; text-transform: uppercase;
    }
    .settings-theme-grid { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .settings-panel .theme-dot {
      min-width: 0; width: 24px; height: 24px; padding: 0;
      border: 2px solid transparent; border-radius: 50%; box-shadow: none;
    }
    .settings-panel .theme-dot:hover { transform: scale(1.16); box-shadow: 0 0 13px currentColor; }
    .settings-panel .theme-dot.active { border-color: #fff; }
    .settings-switches { display: grid; gap: 10px; }
    .settings-switch {
      display: flex; align-items: center; justify-content: space-between;
      gap: 14px; color: #bdd0de; font-size: .84em; cursor: pointer;
    }
    .settings-switch input {
      appearance: none; width: 34px; height: 18px; flex: 0 0 auto;
      border-radius: 999px; background: #26364b; border: 1px solid #415873;
      position: relative; cursor: pointer; transition: .2s ease;
    }
    .settings-switch input::after {
      content: ''; position: absolute; width: 12px; height: 12px;
      left: 2px; top: 2px; border-radius: 50%; background: #8fa5b8;
      transition: .2s ease;
    }
    .settings-switch input:checked {
      background: color-mix(in srgb, var(--c1) 72%, #152440);
      border-color: var(--cyan); box-shadow: 0 0 12px color-mix(in srgb, var(--c2) 28%, transparent);
    }
    .settings-switch input:checked::after { transform: translateX(16px); background: #fff; }
    .settings-switch.is-disabled { opacity: .4; cursor: not-allowed; }
    .settings-switch.is-disabled input { cursor: not-allowed; }
    .settings-select {
      display: grid; gap: 6px; color: #bdd0de; font-size: .84em;
    }
    .settings-select select {
      width: 100%; padding: 8px 10px; border: 1px solid #415873;
      border-radius: 8px; color: var(--ink); background: #0a1629;
      font-size: .95em;
    }

    .filters-button { min-width: 0; align-self: end; padding: 10px 14px; white-space: nowrap; }
    .filter-count {
      display: inline-grid; place-items: center; min-width: 20px; height: 20px;
      margin-left: 5px; padding: 0 5px; border-radius: 999px;
      color: #06101e; background: var(--cyan); font-size: .78em; font-weight: 900;
    }
    .filter-count:empty { display: none; }
    .filter-panel {
      flex: 1 0 100%; display: grid;
      grid-template-columns: repeat(4, minmax(140px, 1fr)) auto;
      align-items: end; gap: 12px; padding-top: 13px; margin-top: 2px;
      border-top: 1px solid var(--line);
    }
    .filter-panel[hidden] { display: none; }
    .filter-panel .group { min-width: 0; }
    .filter-panel select { width: 100%; }
    .filter-action { min-width: 0; padding: 10px 12px; white-space: nowrap; }
    @media (max-width: 1050px) { .filter-panel { grid-template-columns: repeat(2, minmax(150px, 1fr)); } }
    @media (max-width: 560px) { .filter-panel { grid-template-columns: 1fr; } }

    .card-actions { display: flex; gap: 4px; margin-left: auto; align-items: center; }
    .icon-btn {
      min-width: 30px; height: 30px; padding: 0 7px; display: inline-grid; place-items: center;
      border: 1px solid var(--line); background: rgba(117,231,255,.06); color: var(--muted);
      box-shadow: none; font-size: .8em; line-height: 1;
    }
    .icon-btn:hover { color: var(--cyan); }
    .icon-btn.active { color: #06101e; background: var(--cyan); border-color: var(--cyan); }
    .state-btn { width: auto; min-width: 0; white-space: nowrap; padding-inline: 8px; }
    .fav-btn.icon-btn { margin-left: 0; font-size: 1em; opacity: .55; }
    .fav-btn.icon-btn.active { color: #ffe36e; background: rgba(255,227,110,.12); }
    .figure-count {
      position: absolute; right: 8px; bottom: 8px; z-index: 2; min-width: 0;
      padding: 5px 8px; border: 1px solid rgba(255,255,255,.35); border-radius: 999px;
      background: rgba(2,7,18,.78); color: #fff; font-size: .72em; font-weight: 800;
      backdrop-filter: blur(8px);
    }
    .paper-visual.has-image { cursor: zoom-in; }
    .preview-actions { display: flex; flex-wrap: wrap; gap: 7px; margin: 12px 0; }
    .preview-action { min-width: 0; padding: 7px 10px; font-size: .78em; }
    .preview-action.active { color: #06101e; background: var(--cyan); border-color: var(--cyan); }
    .pdf-load-state {
      flex: 1; min-height: 180px; display: grid; place-items: center; text-align: center;
      padding: 24px; border: 1px dashed var(--line-bright); border-radius: 9px;
      background: radial-gradient(circle, rgba(117,231,255,.08), transparent 65%);
    }
    .pdf-load-state p { color: var(--muted); margin: 0 0 14px; line-height: 1.5; }

    .pagination {
      display: flex; align-items: center; justify-content: center; flex-wrap: wrap;
      gap: 7px; margin: 18px 0 24px; padding: 12px;
      border: 1px solid var(--line); border-radius: 12px;
      background: rgba(5,14,31,.72); backdrop-filter: blur(12px);
    }
    .pagination-summary { color: var(--muted); font-size: .82em; margin-right: 5px; }
    .page-button {
      min-width: 34px; height: 34px; padding: 0 9px; border: 1px solid var(--line-bright);
      color: var(--muted); background: rgba(117,231,255,.05); box-shadow: none;
      font-size: .82em;
    }
    .page-button.active { color: #06101e; background: var(--cyan); border-color: var(--cyan); }
    .page-button:hover:not(:disabled) { color: var(--ink); box-shadow: 0 0 12px rgba(117,231,255,.16); }
    .page-ellipsis { color: var(--muted); padding: 0 2px; }

    .figure-modal {
      position: fixed; inset: 0; z-index: 1000; display: grid; place-items: center;
      padding: 22px; background: rgba(0,3,12,.9); backdrop-filter: blur(18px);
    }
    .figure-modal[hidden] { display: none; }
    .figure-dialog {
      width: min(1180px, 96vw); height: min(850px, 92vh); display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px; padding: 16px;
      position: relative; overflow: hidden;
      border: 1px solid var(--line-bright); border-radius: 14px;
      background: linear-gradient(155deg, rgba(11,22,47,.99), rgba(3,8,20,.99));
      box-shadow: 0 0 55px color-mix(in srgb, var(--c1) 22%, transparent);
    }
    .figure-modal-head { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; min-width: 0; width: 100%; }
    .figure-modal-title { min-width: 0; flex: 1; color: var(--ink); font-weight: 850; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .figure-stage { position: relative; min-width: 0; min-height: 0; display: grid; place-items: center; overflow: hidden; border-radius: 10px; background: #f5f6fa; }
    .figure-stage img { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
    .figure-stage.is-fit { overflow: hidden; }
    .figure-stage.is-fit img { position: absolute; inset: 0; width: 100%; height: 100%; max-width: 100%; max-height: 100%; object-fit: contain; }
    .figure-stage.is-actual { display: block; overflow: auto; overscroll-behavior: contain; touch-action: pan-x pan-y pinch-zoom; }
    .figure-stage.is-actual img { width: auto; height: auto; min-width: 100%; max-width: none; max-height: none; object-fit: initial; }
    .figure-modal-foot { display: grid; grid-template-columns: auto auto minmax(0,1fr) auto; align-items: center; gap: 14px; min-width: 0; width: 100%; }
    .figure-caption { min-width: 0; color: #c7d8e7; line-height: 1.5; max-height: 7.5em; overflow: auto; }
    .figure-nav { min-width: 42px; padding: 9px; }
    #figureClose { flex: 0 0 auto; touch-action: manipulation; }
    .figure-mobile-close-bottom { display: none; }
    .figure-position { color: var(--cyan); font-size: .78em; white-space: nowrap; }
    .figure-zoom-toggle { min-width: 70px; padding: 8px 10px; white-space: nowrap; }

    /* Monochrome newspaper format */
    html:has(body.theme-newspaper) { background: #e9e4d8; color-scheme: light; }
    body.theme-newspaper {
      --space-0:#e9e4d8; --space-1:#f5f1e7; --space-2:#fffdf7;
      --panel:rgba(255,253,247,.94); --panel-strong:#fffdf7; --panel-soft:#efebe1;
      --line:rgba(16,16,16,.34); --line-bright:#111; --ink:#111; --muted:#4b4b47; --cyan:#111;
      color: #111; font-family: Georgia, "Times New Roman", "Noto Serif", serif;
      letter-spacing: 0; background: #e9e4d8;
    }
    body.theme-newspaper::before {
      background:
        repeating-linear-gradient(0deg, rgba(0,0,0,.018) 0 1px, transparent 1px 4px),
        linear-gradient(90deg, #e8e2d5, #f7f3e9 50%, #e8e2d5);
    }
    body.theme-newspaper::after {
      inset: 0; opacity: .22; animation: none;
      background-image: radial-gradient(circle, rgba(0,0,0,.28) 0 .55px, transparent .75px);
      background-size: 5px 5px;
    }
    body.theme-newspaper .header {
      min-height: 150px; margin-bottom: 14px; padding-bottom: 18px;
      border-top: 5px double #111; border-bottom: 5px double #111;
    }
    body.theme-newspaper .header::before { display: none; }
    body.theme-newspaper .header-kicker,
    body.theme-newspaper .header-subtitle {
      color: #111; text-shadow: none; letter-spacing: .22em;
    }
    body.theme-newspaper .header h1 {
      color: #111; font-family: Georgia, "Times New Roman", serif;
      font-weight: 950; letter-spacing: .035em; text-shadow: none;
    }
    body.theme-newspaper .header h1 span { color: #111; }
    body.theme-newspaper .theme-dot.newspaper {
      border-radius: 2px; background: linear-gradient(90deg, #111 0 50%, #f8f4e9 50%);
      border-color: #8c887f;
    }
    body.theme-newspaper .settings-panel .theme-dot:not(.newspaper) { border-radius: 50%; }
    body.theme-newspaper .theme-dot.purple { background: linear-gradient(135deg,#667eea,#764ba2); }
    body.theme-newspaper .theme-dot.ocean  { background: linear-gradient(135deg,#2E3192,#1BFFFF); }
    body.theme-newspaper .theme-dot.sunset { background: linear-gradient(135deg,#FF512F,#F09819); }
    body.theme-newspaper .theme-dot.forest { background: linear-gradient(135deg,#134E5E,#71B280); }
    body.theme-newspaper .theme-dot.night  { background: linear-gradient(135deg,#2C3E50,#4CA1AF); }
    body.theme-newspaper .theme-dot.rose   { background: linear-gradient(135deg,#ED4264,#FFEDBC); }
    body.theme-newspaper .theme-dot.dark   { background: linear-gradient(135deg,#0F0F0F,#666); }
    body.theme-newspaper :is(.controls, .status, .section-title, .settings-panel, .paper-quickview-dialog, .figure-dialog, .abstract-card, .pdf-card) {
      color: #111; background: #fffdf7; border-color: #111; border-radius: 0;
      box-shadow: 4px 4px 0 rgba(0,0,0,.9); backdrop-filter: none;
    }
    body.theme-newspaper .category-tab {
      color: #111; background: #f8f4e9; border: 1px solid #111;
      border-radius: 0; font-family: Georgia, "Times New Roman", serif; backdrop-filter: none;
    }
    body.theme-newspaper .category-tab:hover { color: #111; background: #ddd7ca; box-shadow: none; }
    body.theme-newspaper .category-tab.active,
    body.theme-newspaper .category-tab.fav-tab.active,
    body.theme-newspaper .category-tab.queue-tab.active,
    body.theme-newspaper .category-tab.read-tab.active {
      color: #fff; background: #111; border-color: #111; box-shadow: none;
    }
    body.theme-newspaper label,
    body.theme-newspaper :is(.settings-switch, .settings-select, .settings-heading) { color: #222; }
    body.theme-newspaper :is(select, input[type="date"], .search-wrap input[type="text"], .settings-select select) {
      color: #111; background: #fff; border-color: #111; border-radius: 0;
      box-shadow: inset 0 -1px 0 #777; font-family: Georgia, "Times New Roman", serif;

<script>
  /* Constants */

  const PROXY_SERVICES = [
    {
      name: 'AllOrigins',
      build: url => `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`
    },
    {
      name: 'CorsProxy.io',
      build: url => `https://corsproxy.io/?url=${encodeURIComponent(url)}`
    },
    {
      name: 'CodeTabs',
      build: url => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(url)}`
    },
    {
      name: 'Cors.sh',
      build: url => `https://cors.sh/${url}`
    }
  ];

  const CATEGORIES = [
    { code: 'astro-ph',    label: 'Astrophysics (all)' },
    { code: 'astro-ph.CO', label: 'Cosmology & Nongalactic' },
    { code: 'astro-ph.EP', label: 'Earth & Planetary' },
    { code: 'astro-ph.GA', label: 'Astrophysics of Galaxies' },
    { code: 'astro-ph.HE', label: 'High Energy Phenomena' },
    { code: 'astro-ph.IM', label: 'Instrumentation & Methods' },
    { code: 'astro-ph.SR', label: 'Solar & Stellar' }
  ];

  const SECTION_LABELS = {
    new: 'New submissions',
    cross: 'Cross submissions',
    repl: 'Replacement submissions'
  };

  const SECTIONS = ['new', 'cross', 'repl'];
  const MAX_CHUNK = 200;
  const FETCH_TIMEOUT = 12000;
  const STATIC_DATA_SCHEMA = 1;
  const FAV_TAB_CODE = '__favorites__';
  const TO_READ_TAB_CODE = '__to_read__';
  const READ_TAB_CODE = '__read__';
  const SAVED_TAB_CODES = new Set([FAV_TAB_CODE, TO_READ_TAB_CODE, READ_TAB_CODE]);
  const THEMES = new Set(['purple', 'ocean', 'sunset', 'forest', 'night', 'rose', 'dark', 'newspaper']);
  const API_BASE_URL = String(window.ARXIV_HEADLINES_CONFIG?.apiBaseUrl || '').trim().replace(/\/+$/, '');

  /* State */

  let selectedCategory = 'astro-ph';
  let currentSelectedCard = null;
  let currentDateRange = 1;
  let customStartDate = '';
  let sectionColumns = { new: 2, cross: 2, repl: 2 };
  let searchQuery = '';
  let favorites = new Set();
  let readingStates = new Map();
  let sortMode = 'date-desc';
  let categoryFilter = 'all';
  let readingFilter = 'all';
  let imageFilter = 'all';
  let pageSize = 24;
  let currentPage = 1;
  let galleryPaper = null;
  let galleryIndex = 0;
  let galleryZoomMode = 'fit';
  let quickViewReturnFocus = null;
  let loadGeneration = 0;

  let lastGoodProxyIdx = 0;
  const fetchCache = new Map();

  /* Helpers */

  const pad2 = n => String(n).padStart(2, '0');
  const cleanText = s => (s ?? '').replace(/\s+/g, ' ').trim();
  const normalizeId = id => (id || '').trim().replace(/v\d+$/i, '');
  const apiUrl = path => API_BASE_URL ? `${API_BASE_URL}${path}` : path;

  function escapeHtml(text) {
    const d = document.createElement('div');
    d.textContent = text ?? '';
    return d.innerHTML;
  }

  function safeArxivImageUrl(value) {
    try {
      const url = new URL(value);
      return url.protocol === 'https:' &&
        url.hostname === 'arxiv.org' &&
        url.pathname.startsWith('/html/')
        ? url.href
        : '';
    } catch (_) {
      return '';
    }
  }

  function paperFigures(paper) {
    const figures = Array.isArray(paper?.figures) ? paper.figures : [];
    const valid = figures.map(figure => ({
      url: safeArxivImageUrl(figure?.url),
      caption: cleanText(figure?.captionLatex || figure?.caption || '')
    })).filter(figure => figure.url);

    if (valid.length) return valid;
    const thumbnailUrl = safeArxivImageUrl(paper?.thumbnailUrl);
    return thumbnailUrl ? [{ url: thumbnailUrl, caption: cleanText(paper.thumbnailAlt || '') }] : [];
  }

  function extractIdFromAbsUrl(url) {
    const m = (url || '').match(/\/abs\/([^?#]+)/);
    return m?.[1] ? normalizeId(m[1]) : '';
  }

  function chunkArray(arr, size) {
    const out = [];
    for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
    return out;
  }

  function delay(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  function normalizeSearchText(value) {
    return String(value || '')
      .normalize('NFKD')
      .replace(/\p{M}/gu, '')
      .replace(/\\[a-zA-Z]+/g, ' ')
      .toLowerCase()
      .replace(/[^a-z0-9\u3400-\u9fff]+/g, ' ')
      .trim();
  }

  function editDistanceWithin(left, right, limit) {
    if (Math.abs(left.length - right.length) > limit) return false;
    let previous = Array.from({ length: right.length + 1 }, (_, index) => index);
    for (let row = 1; row <= left.length; row++) {
      const current = [row];
      let rowMin = row;
      for (let column = 1; column <= right.length; column++) {
        const cost = left[row - 1] === right[column - 1] ? 0 : 1;
        current[column] = Math.min(
          current[column - 1] + 1,
          previous[column] + 1,
          previous[column - 1] + cost
        );
        rowMin = Math.min(rowMin, current[column]);
      }
      if (rowMin > limit) return false;
      previous = current;
    }
    return previous[right.length] <= limit;
  }

  function fuzzyTokenMatch(searchText, token) {
    if (searchText.includes(token)) return true;
    if (token.length < 3) return false;
    const limit = token.length >= 7 ? 2 : 1;
    return searchText.split(' ').some(word =>
      (token.length >= 3 && word.startsWith(token)) || editDistanceWithin(word, token, limit)
    );
  }

  function paperMatchesSearch(paper, query) {
    const tokens = normalizeSearchText(query).split(' ').filter(Boolean);
    if (!tokens.length) return true;
    const searchText = normalizeSearchText([
      paper?.title,
      ...(paper?.authors || []),
      paper?.summary,
      ...(paper?.categories || []),
      paper?.absId
    ].filter(Boolean).join(' '));
    return tokens.every(token => fuzzyTokenMatch(searchText, token));
  }

  function highlightText(text, query) {
    const escaped = escapeHtml(text);
    const tokens = String(query || '').trim().split(/\s+/).filter(token => token.length > 1);
    if (!tokens.length) return escaped;
    const pattern = tokens
      .map(token => token.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'))
      .sort((a, b) => b.length - a.length)
      .join('|');
    return escaped.replace(new RegExp(`(${pattern})`, 'gi'), '<mark>$1</mark>');
  }

  function escapeLatexText(text) {
    return String(text || '').replace(/[&%#$\{\}_~^]/g, character => ({
      '&': '\\&', '%': '\\%', '#': '\\#', '$': '\\$',
      '{': '\\{', '}': '\\}', '_': '\\_', '~': '\\sim ', '^': '\\^{}'
    })[character] || character);
  }

  function captionWithLatex(text) {
    const source = cleanText(text || 'No caption available.');
    if (!source) return 'No caption available.';
    const parts = source.match(/\$[^$]+\$|\\\([\s\S]*?\\\)|\s+|[^\s]+/g) || [];
    return parts.map(part => {
      if (/^\s+$/.test(part)) return part;
      const dollarMath = part.startsWith('$') && part.endsWith('$');
      const parenMath = part.startsWith('\\(') && part.endsWith('\\)');
      const core = dollarMath ? part.slice(1, -1) : parenMath ? part.slice(2, -2) : part;
      const mathLike = dollarMath || parenMath ||
        /[\\_^=<>±×÷≈≃≤≥∑∫√∞°⊙]|\d/.test(core) || /^[A-Za-z][,.;:]?$/.test(core);
      const latex = mathLike ? core : `\\text{${escapeLatexText(core)}}`;
      return `\\(${escapeHtml(latex)}\\)`;
    }).join('');
  }

  /* Favorites */

  function saveFavorites() {
    try {
      localStorage.setItem('arxivFavorites', JSON.stringify([...favorites]));
    } catch (_) {}
  }

  function loadFavorites() {
    try {
      favorites = new Set(JSON.parse(localStorage.getItem('arxivFavorites') || '[]'));
    } catch (_) {
      favorites = new Set();
    }
  }

  function toggleFavorite(absId) {
    favorites.has(absId) ? favorites.delete(absId) : favorites.add(absId);
    saveFavorites();

    document.querySelectorAll(`.paper-card[data-absid="${CSS.escape(absId)}"]`).forEach(card => {
      card.classList.toggle('favorited', favorites.has(absId));

    renderCategoryTabs();

  /* Reading states */

  function loadReadingStates() {
    try {
      const stored = JSON.parse(localStorage.getItem('arxivReadingStates') || '{}');
      readingStates = new Map(Object.entries(stored).filter(([, state]) => state === 'queue' || state === 'read'));
    } catch (_) {
      readingStates = new Map();
    }
  }

  function saveReadingStates() {
    try { localStorage.setItem('arxivReadingStates', JSON.stringify(Object.fromEntries(readingStates))); } catch (_) {}
  }

  function setReadingState(absId, nextState) {
    const current = readingStates.get(absId) || 'unread';
    if (current === nextState || nextState === 'unread') readingStates.delete(absId);
    else readingStates.set(absId, nextState);
    saveReadingStates();

  function applySettings(s) {
    if (!s) return;
    if (s.theme) setTheme(s.theme, false);
    if (/^\d{4}-\d{2}-\d{2}$/.test(s.customStartDate || '')) {

      if (s.previewPanel != null) document.getElementById('previewPanelToggle').checked = s.previewPanel;

  /* Theme */

  function setTheme(theme, save = true) {
    const nextTheme = THEMES.has(theme) ? theme : 'purple';
    document.body.className = `theme-${nextTheme}`;
    document.querySelectorAll('.theme-dot').forEach(d => d.classList.remove('active'));
    document.querySelector(`.theme-dot.${nextTheme}`)?.classList.add('active');
