services:
  - type: web
    name: arxiv-headlines
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.19.0
