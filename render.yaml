services:
  - type: web
    name: arxiv-headlines
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.19.0
      - key: CACHE_S3_ENDPOINT
        sync: false
      - key: CACHE_S3_BUCKET
        sync: false
      - key: CACHE_S3_ACCESS_KEY_ID
        sync: false
      - key: CACHE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: CACHE_S3_REGION
        value: auto
      - key: CACHE_S3_PREFIX
        value: arxiv-headlines/
