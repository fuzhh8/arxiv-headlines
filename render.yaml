services:
  - type: web
    name: arxiv-headlines
    runtime: node
    plan: free
    buildCommand: npm install --ignore-scripts
    startCommand: node server.mjs
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.19.0
      - key: CACHE_S3_ENDPOINT
        sync: false
      - key: CACHE_S3_BUCKET
        sync: false
      - key: CACHE_S3_ACCESS_KEY_ID
        sync: false
      - key: CACHE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: CACHE_S3_REGION
        value: auto
      - key: CACHE_S3_PREFIX
        value: arxiv-headlines/

  - type: web
    name: arxiv-headlines-static
    runtime: static
    buildCommand: node scripts/build-static.mjs
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    envVars:
      - key: ARXIV_API_BASE_URL
        fromService:
          name: arxiv-headlines
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    headers:
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /config.js
        name: Cache-Control
        value: no-cache
      - path: /data/*
        name: Cache-Control
        value: no-cache
